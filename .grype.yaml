# Grype allowlist — read by the nightly inventory scan.
#
# Schema and examples: docs/ops/dep-management.md § Allowlist; enforced
# by scripts/check-allowlist-schema.sh. This file is also Grype's config:
# it may hold `ignore:` only, so no scanner setting can slip in as an
# exception.

ignore:
  # Same finding as .trivyignore.yaml's go-jose v3 entry — see its
  # comment. Scoped to the v3 module inside the Caddy binary.
  - vulnerability: GHSA-mgcc-cww5-fp2q
    package:
      name: github.com/go-jose/go-jose/v3
      location: /usr/bin/caddy
    owner: '@vlzware'
    reason: JWK-parsing DoS on ACME-server/PKI paths our Caddyfile does not enable; no v3 fix
    expires: 2027-01-26

  # OpenSSL 3.5.9-r1 in Alpine 3.24 (app, backup, db): CVE-2026-124709
  # (QUIC server), -107494 (QUIC peer), -84786 (DANE client), -121482
  # (CRL checking during X509 verify; quadratic via CMS/PKCS#7), -107493
  # (PEM_X509_INFO_read_bio_ex into a caller's stack). OpenSSL rates
  # four Low and has not rated -121482; all are fixed in 3.5.10.
  # CISA-ADP's High (via NVD) trips the gate. No Alpine branch, edge
  # included, has a fix yet. Unreached here (checked 2026-11-21): no
  # binary linking the system libraries imports an OSSL_QUIC_*, DANE,
  # CMS/PKCS7 or SMIME symbol; nothing configures CRL checking (no
  # Postgres ssl_crl_file, libpq sslcrl or Node tls `crl`); the one
  # PEM_X509_INFO_read caller, krb5's k5tls.so (db), passes a NULL
  # stack. Node bundles its own OpenSSL 3.5.9, invisible to Grype (an
  # accepted gap), built without QUIC; a Node release brings 3.5.10.
  # Drop when 3.24 ships the fix: `apk upgrade` takes it.
  - &openssl-3-24
    vulnerability: CVE-2026-84786
    package:
      name: libssl3
      type: apk
    owner: '@vlzware'
    reason: QUIC, DANE, CRL checking, CMS/PKCS#7 and caller-stack PEM paths unused (see comment above); no Alpine 3.24 fix yet
    expires: 2026-12-21
  - <<: *openssl-3-24
    vulnerability: CVE-2026-107493
  - <<: *openssl-3-24
    vulnerability: CVE-2026-107494
  - <<: *openssl-3-24
    vulnerability: CVE-2026-121482
  - <<: *openssl-3-24
    vulnerability: CVE-2026-124709
  - &openssl-3-24-crypto
    <<: *openssl-3-24
    package:
      name: libcrypto3
      type: apk
  - <<: *openssl-3-24-crypto
    vulnerability: CVE-2026-107493
  - <<: *openssl-3-24-crypto
    vulnerability: CVE-2026-107494
  - <<: *openssl-3-24-crypto
    vulnerability: CVE-2026-121482
  - <<: *openssl-3-24-crypto
    vulnerability: CVE-2026-124709
