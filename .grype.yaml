# Grype allowlist — read by the nightly inventory scan.
#
# Schema and examples: docs/ops/dep-management.md § Allowlist; enforced
# by scripts/check-allowlist-schema.sh. This file is also Grype's config:
# it may hold `ignore:` only, so no scanner setting can slip in as an
# exception.

ignore:
  # Same finding as .trivyignore.yaml's go-jose v3 entry — see its
  # comment. Scoped to the v3 module inside the Caddy binary.
  - vulnerability: GHSA-mgcc-cww5-fp2q
    package:
      name: github.com/go-jose/go-jose/v3
      location: /usr/bin/caddy
    owner: '@vlzware'
    reason: JWK-parsing DoS on ACME-server/PKI paths our Caddyfile does not enable; no v3 fix
    expires: 2027-01-26
  # In the Postgres image; no image with zlib 1.4-r0 exists yet.
  - vulnerability: CVE-2026-4738
    package:
      name: zlib
      version: 1.3.2-r1
    owner: '@vlzware'
    reason: Advisory is GDAL's bundled contrib/infback9; the image's libz exports no inflateBack9, so the code is not there
    expires: 2026-12-07
