# Trivy allowlist — read by every Trivy scan: the PR gate's secret, IaC
# and image scans and the nightly inventory scan.
#
# Schema and examples: docs/ops/dep-management.md § Allowlist; enforced
# by scripts/check-allowlist-schema.sh. Scope every entry (`paths:`,
# image-relative without the leading `/`, or `purls:`): an unscoped id is
# ignored in every image. Merge keys (`<<: *anchor`) share fields across
# a run of entries; Trivy and the schema check both resolve them.

vulnerabilities:
  # gosu 1.19 in postgres:17-alpine (the `db` service), built with Go
  # 1.24.6; upstream does not rebuild gosu for stdlib CVEs. gosu runs once,
  # as root, at container start: it reads /etc/passwd and /etc/group,
  # calls setgroups/setgid/setuid and execs postgres. None of the affected
  # packages (net/http, crypto/tls, crypto/x509, archive/*, encoding/*,
  # ...) is on that path, and it takes no input but its argv. Renew while
  # the image ships this gosu; drop when it ships one built with a fixed Go.
  - &gosu
    id: CVE-2025-61726
    paths:
      - usr/local/bin/gosu
    owner: '@vlzware'
    statement: Go stdlib CVE in gosu, unreachable on its privilege-drop-and-exec path (see comment above)
    expired_at: 2027-01-25
  - <<: *gosu
    id: CVE-2025-61729
  - <<: *gosu
