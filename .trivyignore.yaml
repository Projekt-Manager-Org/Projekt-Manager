# Trivy allowlist — read by every Trivy scan: the PR gate's secret, IaC
# and image scans and the nightly inventory scan.
#
# Schema and examples: docs/ops/dep-management.md § Allowlist; enforced
# by scripts/check-allowlist-schema.sh. Scope every entry (`paths:`,
# image-relative without the leading `/`, or `purls:`): an unscoped id is
# ignored in every image. Merge keys (`<<: *anchor`) share fields across
# a run of entries; Trivy and the schema check both resolve them.

vulnerabilities:
  # x/crypto in Caddy: GO-2026-5932 flags the openpgp packages as unsafe
  # by design. Trivy matches the module; the advisory applies only to
  # binaries importing openpgp, and Caddy links none (no
  # x/crypto/openpgp symbols, checked 2026-11-03). The fix is an untagged
  # commit; drop when a tagged x/crypto past v0.58.0 reaches Caddy.
  - id: GO-2026-5932
    paths:
      - usr/bin/caddy
    purls:
      - pkg:golang/golang.org/x/crypto
    owner: '@vlzware'
    statement: openpgp packages not linked into Caddy (see comment above)
    expired_at: 2027-02-01

  # go-jose v3 in Caddy (via smallstep): GHSA-mgcc-cww5-fp2q, CPU DoS
  # when parsing a crafted RSA JWK; no v3 fix exists (v4 is raised to
  # 4.1.6 in docker/caddy/Dockerfile). Our Caddyfile is a reverse proxy
  # plus an ACME client (DNS-01) — JWK parsing is on the ACME-server/PKI
  # paths it does not enable. Scoped to the v3 module in the Caddy binary,
  # so a v4 regression, or v3 linked by another image, still fails. Drop
  # when Caddy stops linking v3.
  - id: CVE-2026-116587
    paths:
      - usr/bin/caddy
    purls:
      - pkg:golang/github.com/go-jose/go-jose/v3
    owner: '@vlzware'
    statement: JWK-parsing DoS on ACME-server/PKI paths our Caddyfile does not enable; no v3 fix (see comment above)
    expired_at: 2027-01-26
