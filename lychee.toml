# Markdown link checker (AC-348).
#
# Resolves relative file links and `#anchor` fragments across every
# tracked `*.md`. Consumed identically by CI (`lychee-action` in the
# `lint` job) and by `npm run check:links` — every flag lives here so
# the two paths cannot drift; only the input glob is passed on the
# command line.
#
# Why lychee and not a script: the two requirements this repo learned
# the hard way in #289 are the two that are easy to get wrong, and both
# are stock behaviour here.
#
#   - GitHub's heading-slug algorithm. `"A & B"` slugs to `a--b` — the
#     `&` is dropped and each surrounding space becomes a hyphen.
#     `HeadingIdGenerator::into_kebab_case` implements exactly that,
#     duplicate-heading `-1` / `-2` suffixes included.
#   - Inline HTML anchors. `docs/adr/0020-*.md` carries
#     `<a id="retention"></a>` on a list item and ten documents cite
#     `#retention`. lychee folds `Event::Html | Event::InlineHtml` into
#     the fragment set, so those resolve; a heading-only checker would
#     flag all ten.
#
# Directory links (`docs/ops/backup/`) are valid — no `index_files` is
# configured, so a directory that exists on disk resolves.

# No network calls in CI. External `http(s)://` and `mailto:` targets
# are skipped entirely: a flaky third-party host must not be able to
# fail the lint job.
offline = true

# Resolve `#anchor` fragments. `text-only` (`#:~:text=`) is not a form
# this repo uses, so anchors alone keep the check narrow.
include_fragments = "anchor-only"

no_progress = true
