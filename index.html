<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The two placeholders below are substituted from
      src/config/brandingConfig.ts by the `brand-app-shell` plugin
      (src/build/brandAppShell.ts, AC-363), in dev and in build alike.
      Literals here would be a second copy of values the config already
      owns. An unsubstituted placeholder is meant to reach the tab, so
      a broken injection fails loudly instead of quietly rendering the
      default name.

      Do not write either placeholder token into this comment: the
      substitution is a plain text replace over the whole document and
      would rewrite the sentence describing it.
    -->
    <meta name="theme-color" content="%SHELL_THEME_COLOR%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>%APP_NAME%</title>
    <!--
      Pre-paint theme restoration. Blocks HTML parsing synchronously so
      data-theme is set before any themed content paints. Kept as a
      'self'-origin file (public/theme-init.js) so the app's CSP
      (script-src 'self') permits it without 'unsafe-inline' or a hash.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
