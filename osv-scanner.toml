# OSV-Scanner allowlist.
#
# Each ignored vuln MUST include all three TOML fields below (per ADR-0027
# §Negative and docs/ops/dep-management.md §Allowlist). Entries missing any
# field, or with `reason` not starting with `@<github-handle>:`, are rejected
# by scripts/check-allowlist-schema.sh in CI.
#
# Required schema per entry:
#   id           — the OSV identifier (GHSA-..., CVE-..., or OSV-...)
#                  TOML string.
#   ignoreUntil  — bare TOML date literal (YYYY-MM-DD, NOT quoted), at most
#                  90 days from the day the entry was added. The expiry
#                  forces a re-review; OSV-Scanner stops honoring the entry
#                  past this date and the nightlies turn red.
#   reason       — TOML string. MUST start with `@<github-handle>:` so the
#                  owner is encoded (OSV-Scanner has no dedicated owner
#                  field). Brief explanation follows the prefix.
#
[[IgnoredVulns]]
id = "GHSA-4cm8-f57v-mqm6"
ignoreUntil = 2027-01-29  # <= 90 days from renewal 2026-10-31
reason = "@vlzware: prettier pinned to 3.9.10, the advisory's patched release. Repo-level range '>=3.9.0, <=3.9.9; 3.9.9 tested' carries free text, so check-repo-advisories.mjs reports it unevaluated. Drop once the global DB carries the advisory (still repo-level only on 2026-10-31)."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-01  # <= 90 days from 2026-11-01
reason = "@vlzware: glob 13.0.6 via @fastify/static (^13); fixed only in 14.0.2. Needs an aborted `signal`; @fastify/static globs a fixed '**/**' once at registration (wildcard: false, src/server/staticCache.ts) with no signal. Unreachable (#668). Drop when @fastify/static allows glob >=14.0.2 or 13.x gets a backport."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-01  # <= 90 days from 2026-11-01
reason = "@vlzware: minimatch 10.2.6 via glob, eslint, archiver>readdir-glob (^10); fixed only in 11.0.1. Needs an attacker-supplied pattern; all patterns are repo-controlled (the static root's '**/**', eslint config), archiver's glob()/directory() are never called. Unreachable (#668). Drop when the dependents allow minimatch >=11.0.1 or 10.x gets a backport."

[[IgnoredVulns]]
id = "GHSA-8c3j-mm64-257c"
ignoreUntil = 2026-11-09  # fix 11.4.0 clears the 3-day release-age cooldown 2026-11-05; expiry doubles as the watchdog for its Renovate bump
reason = "@vlzware: @fastify/cors 11.3.1; preflight DoS only with the non-default hook 'onSend'. src/server/app.ts registers it with the default 'onRequest'. Unreachable (#714). Fixed in 11.4.0 (2026-11-02), held by the release-age cooldown. Drop when @fastify/cors >= 11.4.0 is on main."

[[IgnoredVulns]]
id = "GHSA-3qgw-9275-xf8w"
ignoreUntil = 2026-11-09  # fix 5.12.8 clears the 3-day release-age cooldown 2026-11-05; expiry doubles as the watchdog for its Renovate bump
reason = "@vlzware: fastify 5.12.7; streaming DoS only with a nonzero handlerTimeout. Neither src/server/app.ts nor any route or installed plugin sets it, so it stays at the default 0 and the timer never arms (lib/route.js). Unreachable (#727). Fixed in 5.12.8 (2026-11-02), held by the release-age cooldown. Drop when fastify >= 5.12.8 is on main."
