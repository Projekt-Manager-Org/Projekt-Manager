name: E2E

# Playwright end-to-end tests: nightly on `main`, plus on demand from the
# Actions tab ("Run workflow" button). Rationale:
#
#   Playwright stays OUT of the push/PR gate. It is a serial
#   (`workers: 1`) suite of ~130 tests costing 4-7 min, and the local
#   record is a long tail of flake-chasing — putting that on the merge
#   path taxes every PR and blocks merges on failures that are not the
#   PR's fault.
#
#   But `workflow_dispatch`-only meant it effectively never ran: twelve
#   runs in the project's lifetime, and #377 caught a red `main` that had
#   been red for ~3.5 weeks because the last dispatch predated the spec
#   edit that broke it. A suite outside the merge gate with no scheduled
#   run decays silently, and a red E2E discovered 25 days late is
#   indistinguishable from no E2E.
#
#   The nightly is the tradeoff: the decay window drops from unbounded to
#   24 h at zero PR latency, and a failure is an issue to triage rather
#   than a blocked merge. `notify.yml` monitors this workflow (it is in
#   that file's `workflows:` filter) and raises "E2E is red on main",
#   assigned, one issue per incident, auto-closed on green.
#
#   See architecture.md §11.7 and verification.md AC-37 for the
#   spec-side description of this topology.

on:
  schedule:
    # 03:30 UTC daily = 05:30 Europe/Sofia (EET, winter) / 06:30 (EEST,
    # summer DST). Offset 30 min from `security-scheduled.yml`'s 03:00 so
    # the two nightlies neither contend for runners nor deliver their red
    # notifications in the same minute.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to test (default: current branch)'
        required: false
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest

    # The suite runs 4-7 min. Unattended on a schedule there is no operator
    # watching to cancel a hang, and the job default is 6 h of runner time.
    timeout-minutes: 30

    # Byte-for-byte the same postgres service container as ci.yml's
    # `check-shard` job, comments aside. It has to be duplicated — Actions
    # has no include mechanism for a service block (composite actions have
    # no `services` key; reusable workflows reuse a whole job, and these
    # two jobs share nothing else) — so the invariant is machine-enforced
    # instead: scripts/check-workflow-drift.sh, a step in ci.yml's
    # `lint` job, fails the build when the two diverge. Edit both together.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # POSTGRES_DB defaults to POSTGRES_USER, so omitting it yields
          # a `pm` database. Playwright overrides DATABASE_URL to
          # `projekt_manager_e2e` in playwright.config.ts and creates
          # that DB via `e2e/ensure-db.mjs` — the value below only
          # needs to be reachable for the service health probe.
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # `-h 127.0.0.1` — TCP, not the unix socket. See the identical
        # probe in ci.yml's `check-shard` job for the init-phase
        # temporary-server window this avoids.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pm -d pm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Playwright starts `npm run dev` via playwright.config.ts's
      # `webServer` block, which reads these at startup. STORAGE_*
      # credentials are the capability-restricted app user provisioned by
      # docker/init-storage.sh below — the boot-time bucket-safety probe
      # (#45 / ADR-0022) refuses to start `npm run dev` if these are root
      # creds, so the dev server itself depends on the full provisioning.
      DATABASE_URL: postgresql://pm:postgres@localhost:5432/pm
      # playwright.config.ts reads POSTGRES_PASSWORD to build the isolated
      # E2E DATABASE_URL (`postgresql://pm:<pwd>@.../projekt_manager_e2e`).
      # Locally it comes from `.env` (preloaded by the config). CI has no
      # `.env`, so without this the config falls back to its `changeme`
      # default and the webServer crashes on first connect with "password
      # authentication failed for user pm". Must match the postgres
      # service's POSTGRES_PASSWORD above.
      POSTGRES_PASSWORD: postgres
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: projekt-manager
      # Isolated bucket the Playwright suite targets via playwright.config.ts.
      # Provisioned alongside STORAGE_BUCKET by docker/init-storage.sh in the
      # "Start MinIO" step below; the dev bucket exists only because the
      # boot-time bucket-safety probe runs against it before playwright
      # overrides the value for the test runs themselves.
      STORAGE_BUCKET_E2E: projekt-manager-e2e
      STORAGE_ACCESS_KEY: pmappci
      STORAGE_SECRET_KEY: pmappcisecret
      # MinIO accepts any region; us-east-1 is the SDK default.
      STORAGE_REGION: us-east-1
      # NODE_ENV=test matches what vitest uses; the env schema accepts it
      # and the safety checks in assertProductionSafe() do NOT fire.
      NODE_ENV: test
      # Force a clean seed on every run so each invocation starts from
      # the same snapshot regardless of lingering state from a previous run.
      SEED: force
      # Playwright's `CI` env var governs retries, worker count, and
      # `forbidOnly` (see playwright.config.ts).
      CI: 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # `age` is required by playwright.config.ts, which generates a
      # per-run binary identity via `age-keygen` before spawning the
      # webServer (ADR-0024). Not preinstalled on ubuntu-latest.
      #
      # Same composite as ci.yml's `check-shard` and `build-scan-smoke`:
      # one tool, one pin, one definition. A version skew between E2E and
      # the integration suite would mean the two identities are generated
      # by different `age` builds, which is why this used to be a
      # hand-synced copy guarded by scripts/check-workflow-drift.sh. That
      # check still fails the build if this line goes missing — no PR check
      # would notice otherwise, only the next nightly.
      - uses: ./.github/actions/install-age

      # Storage — MinIO + full bucket/IAM provisioning. Rationale, image
      # pins and readiness handling live in the action; see
      # .github/actions/start-minio/action.yml. The boot-time bucket-safety
      # probe in src/server/storage/safety.ts runs in start.ts and refuses to
      # serve without the full bucket+user shape, so `npm run dev` (started by
      # Playwright's webServer block) cannot boot without this step.
      - name: Start MinIO
        uses: ./.github/actions/start-minio
        with:
          storage_bucket: projekt-manager
          storage_bucket_e2e: projekt-manager-e2e
          # Must match the job-level STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY
          # so `npm run dev` boots under the same restricted user.
          app_access_key: pmappci
          app_secret_key: pmappcisecret

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test

      # Without this the run's evidence dies with the runner.
      # playwright.config.ts sets `trace: 'retain-on-failure'` and the html
      # reporter, but nothing collected either — so #377's investigation had
      # a trace path that only ever existed on the developer's own disk. A
      # nightly nobody can debug is a nightly that gets muted, so the
      # artifact is what makes the schedule above actionable.
      #
      # Not on green: `retain-on-failure` leaves no trace there and the
      # report carries nothing worth 14 days of storage. `cancelled()` is
      # in the condition because `timeout-minutes` above CANCELS the job
      # rather than failing it — without it the unattended hang that
      # timeout exists for is the one failure that uploads nothing.
      - name: Upload Playwright report and traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
