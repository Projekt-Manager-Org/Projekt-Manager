# Scheduled OSV-Scanner scan of `main` (ADR-0027 §Decision.2, nightly).
#
# Catches retroactive CVEs landing on existing deps that no open PR is
# bumping. PR-time gates in ci.yml only see the diff; this is the
# safety net for the steady state.
#
# The same pinned CLI and gate as the PR check (check-osv-introduced.mjs),
# without a base. The ci-red issue is the alert.

name: Security (scheduled)

on:
  schedule:
    # 03:00 UTC daily = 04:00 Europe/Berlin (CET, winter) / 05:00 (CEST,
    # summer DST). Off-hours window in both halves of the year to avoid
    # collision with weekday Renovate runs.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The gate needs Node, not the installed tree: the CLI reads the lockfile.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - uses: ./.github/actions/install-osv-scanner

      - name: OSV-Scanner (lockfile, fail on any vuln)
        run: node scripts/check-osv-introduced.mjs

  # Same steady-state argument as the OSV scan above, for the layer OSV
  # cannot reach: an advisory filed at the upstream repo and never promoted
  # to the global database is invisible to every lockfile scanner
  # (ADR-0027 § 2026-08-28 amendment). The PR gate in ci.yml only fires
  # when someone opens a PR — on a dep nobody is touching, this nightly run
  # is the only thing that will ever notice.
  repo-advisories:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The check reads installed versions and upstream repo URLs from the
      # tree, so the install is a prerequisite, not a convenience.
      - run: npm ci

      # Not optional here. Without --base-dir it fails on every expired
      # entry: this nightly is where a lapsed allowlist entry turns red
      # (`lint` lets one unchanged from its base through, #668). It also
      # owns owner/reason/scope; check-repo-advisories.mjs reads only ids
      # and dates.
      - name: Check allowlist schema (osv-scanner.toml, .trivyignore.yaml, .grype.yaml)
        run: bash scripts/check-allowlist-schema.sh

      # Runs even when the schema check failed: the check honours
      # `ignoreUntil` itself, and one lapsed entry must not blind the scan
      # for every advisory published while it stays red.
      - name: Repo-level advisory check
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-repo-advisories.mjs

      # Where a lapsed register row turns red (`lint` lets one unchanged
      # from its base through). Last check, on any outcome: a register row
      # suppresses no scanner, so it neither blinds a scan nor waits on one.
      - name: Check exception register
        if: ${{ !cancelled() }}
        run: bash scripts/check-exception-register.sh
