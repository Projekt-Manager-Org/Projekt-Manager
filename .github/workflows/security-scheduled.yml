# Scheduled OSV-Scanner full-tree scan (ADR-0027 §Decision.2 layer 3).
#
# Catches retroactive CVEs landing on existing deps that no open PR is
# bumping. PR-time gates in ci.yml only see the diff; this is the
# safety net for the steady state.
#
# Uses Google's official reusable workflow rather than the CLI: the
# reusable workflow handles SARIF upload to the GH Security tab,
# diff-aware reporting, and artifact retention — reimplementing those
# inline would be needless extra code. The PR-time gate in ci.yml uses
# the CLI directly because Google ships no composite action suitable
# for inline use in an existing job; this scheduled job is its own job,
# so the reusable workflow fits naturally.
#
# Findings show up in the repo's "Security > Code Scanning" tab via
# the SARIF upload performed inside the reusable workflow. The job
# itself ALSO fails red (fail-on-vuln: true) so a missing finding in
# the Security tab cannot mask a regression — the schedule fails loud.

name: Security (scheduled)

on:
  schedule:
    # 03:00 UTC daily = 05:00 Europe/Sofia (EET, winter) / 06:00 (EEST,
    # summer DST). Off-hours window in both halves of the year to avoid
    # collision with weekday Renovate runs.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  # Required by the reusable workflow itself — it uploads SARIF to
  # Code Scanning and reads action metadata for annotations.
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    # Reusable workflow pinned by the same SHA as the PR-time CLI
    # binary (v2.3.8 — see ci.yml). The reusable workflow scans the
    # whole tree with `-r ./` by default; we override scan-args to
    # also load the repo allowlist.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        --config=./osv-scanner.toml
        ./
      fail-on-vuln: true

  # Same steady-state argument as the OSV scan above, for the layer OSV
  # cannot reach: an advisory filed at the upstream repo and never promoted
  # to the global database is invisible to every lockfile scanner
  # (ADR-0027 § 2026-08-28 amendment). The PR gate in ci.yml only fires
  # when someone opens a PR — on a dep nobody is touching, this nightly run
  # is the only thing that will ever notice.
  repo-advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The check reads installed versions and upstream repo URLs from the
      # tree, so the install is a prerequisite, not a convenience.
      - run: npm ci

      # Not optional here. check-repo-advisories.mjs scrapes ids out of
      # osv-scanner.toml and does not read `ignoreUntil` — that expiry is
      # owned by this script. OSV-Scanner honours the date itself, so the
      # osv-scan job above needs no equivalent; this one does. Without it a
      # lapsed entry suppresses a match indefinitely, in the steady-state
      # backstop, which is the exact place a stale allowlist matters.
      - name: Check allowlist schema (osv-scanner.toml + .trivyignore)
        run: bash scripts/check-allowlist-schema.sh

      - name: Repo-level advisory check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-repo-advisories.mjs
