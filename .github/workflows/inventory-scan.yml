# Inventory scan (ADR-0027 § 2026-10-29 amendment, control 3): nightly on what
# `main` runs, and from CI's push run on what each merged commit would deploy
# (#740), which is what deploy.sh checks.
#
# Scans every image a deploy runs, with two scanners, and fails red on
# any HIGH/CRITICAL or unrated finding from either. #637 showed what the
# PR gate misses: it scans only the two first-party images, only at PR
# time, and only with Trivy — which cannot see a runtime installed from a tarball
# (the `node` binary) or compiled from source (`postgres`). Grype matches
# those binaries; Trivy saw what Grype missed (Go stdlib in `gosu`, since
# removed, #847).
#
#   allowlists the allowlist schema, expiry included: red on a lapsed
#              entry, without holding back the scans
#   inventory  the image set, derived from the deploy's own compose file
#              and profiles (scripts/ci/deploy-inventory.sh) — a new
#              service is scanned with no change here
#   scan       one job per image: Trivy ∪ Grype, HIGH/CRITICAL/unrated,
#              no ignore-unfixed (tolerable
#              findings go in .trivyignore.yaml / .grype.yaml, path-scoped)
#
# The nightly scans first-party images at the `main` tag, which only `promote`
# writes: the state of main, independent of what any host has deployed.
# Dispatching this on a branch scans the branch's files (inventory, allowlists,
# the Caddy build) against main's first-party images. The push run passes
# `sha-<commit>`.
#
# A red run reaches a human through notify.yml (scheduled runs have no
# PR and no triggering human); scripts/check-notify-coverage.sh fails the
# PR that drops or renames this workflow out of that list.

name: Inventory scan

on:
  schedule:
    # 02:00 UTC, before security-scheduled (03:00), e2e (03:30) and GHCR
    # retention (04:00).
    - cron: '0 2 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      app_image_tag:
        description: Tag of the first-party images to scan.
        type: string
        required: true

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.derive.outputs.images }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Derive inventory
        id: derive
        env:
          APP_IMAGE_TAG: ${{ inputs.app_image_tag || 'main' }}
        run: |
          set -euo pipefail
          images=$(bash scripts/ci/deploy-inventory.sh)
          echo "$images" | jq .
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # Its own job, not a step ahead of the scans (#725): a lapsed entry used
  # to halt `inventory`, so no image was scanned while it lapsed. Grype does
  # not read the expiry, so without this a lapsed .grype.yaml entry would
  # suppress its finding forever; Trivy honours it and reports the finding.
  allowlists:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check allowlist schema (osv-scanner.toml, .trivyignore.yaml, .grype.yaml)
        run: bash scripts/check-allowlist-schema.sh

  scan:
    needs: inventory
    name: scan (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      # Each image is its own verdict; one red image must not hide another.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build image
        if: matrix.build
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -t "$IMAGE" -f "$CONTEXT/$DOCKERFILE" "$CONTEXT"

      - name: Pull image
        if: ${{ !matrix.build }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"

      - name: Trivy
        uses: ./.github/actions/trivy-image
        with:
          image_ref: ${{ matrix.image }}

      # Runs even when Trivy is red: the two scanners see different
      # things, and the run should show both verdicts.
      - name: Install Grype
        id: install-grype
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # renovate: datasource=github-release-attachments depName=anchore/grype
          version="v0.121.3"
          expected_sha="e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85"
          asset="grype_${version#v}_linux_amd64.tar.gz"
          url="https://github.com/anchore/grype/releases/download/${version}/${asset}"
          code=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -w '%{http_code}' -o /tmp/grype.tar.gz "$url") \
            || { echo "::error::Grype download failed (curl exit $?, HTTP ${code:-000}): $url"; exit 1; }
          actual_sha=$(sha256sum /tmp/grype.tar.gz | awk '{print $1}')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Grype tarball SHA256 mismatch — expected $expected_sha got $actual_sha"
            exit 1
          fi
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          sudo mv /tmp/grype /usr/local/bin/grype
          grype version

      # Same floor as the Trivy step: HIGH and above or unrated, unfixed
      # included. Not `--fail-on high`: Grype ranks Unknown below
      # Negligible, so no threshold reaches it; grype-gate.sh judges the
      # JSON report instead. Grype refuses a vulnerability DB older than
      # its max age by default, so a stale DB fails the run instead of
      # scanning against old data.
      # Not after a failed install: a missing binary is that step's failure,
      # not a second one here.
      - name: Grype
        if: ${{ !cancelled() && steps.install-grype.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          grype "docker:$IMAGE" -c .grype.yaml -o table -o "json=$RUNNER_TEMP/grype.json"
          bash scripts/ci/grype-gate.sh "$RUNNER_TEMP/grype.json"
