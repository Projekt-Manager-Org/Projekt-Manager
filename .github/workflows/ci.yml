name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue fires `merge_group` events on a synthetic train
  # branch built from `main` + queued PRs. The queue is currently OFF
  # (see docs/ops/dep-management.md §5 for the evaluation + cost
  # model); this listener is a no-op until/unless the `merge_queue`
  # rule is re-added to the `main protection` Ruleset. Kept in place
  # because removing it would mean a future re-enable also needs a
  # workflow edit, and forgetting that edit makes the queue silently
  # time out (PRs sit `CLEAN` for 60 min then get rejected with no
  # actionable signal — see #214 history).
  merge_group:
  # Manual escape hatch for building/publishing images on a feature
  # branch so it can be deployed to the VPS via scripts/deploy.sh
  # without first merging to main. CLI-only by design — the GH UI
  # "Run workflow" button only surfaces workflows from the default
  # branch, so for now invoke as:
  #   gh workflow run ci.yml --ref <branch>
  # Mirrors the same pattern used by .github/workflows/e2e.yml.
  workflow_dispatch:

# Cancel only superseded *same-class* runs on a branch; never let one
# event class cancel another. The PR merge box credits `check`/`lint`
# ONLY from the `pull_request` run — a `workflow_dispatch` run's checks
# are never associated with the PR, even on the same SHA, even when green.
# So the operator's dispatch run (a superset: it also builds+pushes the
# GHCR image for a feature-branch deploy via `gh workflow run ci.yml`) must
# not cancel the PR run — doing so left the merge box reporting the
# cancelled PR checks ("checks failing") while the dispatch run was green
# (#234). The event-name suffix puts each class in its own lane: a newer
# push's `pull_request` run still cancels the stale one (the dedup we want),
# but a dispatch never touches it.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Static-analysis pillar. Runs in parallel with `check-shard`
  # below — both are required gates, but they share no runner state.
  # No postgres service, no MinIO; only the npm cache + the static
  # checkers. Build also lives here because it has no DB/MinIO
  # dependency and we want the test shards' critical path to be
  # tests only.
  # ---------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Catches the specific drift class where `package.json` carries an
      # exact pin (e.g. `eslint: 10.3.0`) but `package-lock.json` resolves
      # the package to a different version (e.g. 10.4.0). The Renovate
      # `rangeStrategy: pin` + `lockFileMaintenance` interaction can
      # produce this: a pin PR generated against an older lockfile state
      # merges after a `lockFileMaintenance` PR bumped the resolved
      # version past the pin range, and the pin PR's lockfile is never
      # regenerated. `npm ci` below would also flag this, but a named
      # step with an actionable error message is cheaper to triage than
      # parsing npm's wall-of-errors output. See #214 for the incident.
      - name: Lockfile-pin drift sanity check
        run: |
          node -e '
            const pj = require("./package.json");
            const pl = require("./package-lock.json");
            const deps = { ...(pj.dependencies || {}), ...(pj.devDependencies || {}) };
            const drift = Object.entries(deps)
              .filter(([, v]) => /^\d+\.\d+\.\d+(?:-[\w.]+)?$/.test(v))
              .map(([n, v]) => [n, v, pl.packages?.["node_modules/" + n]?.version])
              .filter(([, v, r]) => r && r !== v);
            if (drift.length) {
              console.error("::error::Lockfile drift: exact pins in package.json do not match resolved versions in package-lock.json");
              drift.forEach(([n, v, r]) => console.error(`  ${n}: package.json=${v}  lockfile=${r}`));
              console.error("");
              console.error("Likely cause: a Renovate pin PR shipped without regenerating the lockfile after a lockFileMaintenance merge.");
              console.error("Fix: on a branch, run `npm install --package-lock-only`, commit package-lock.json, open PR.");
              process.exit(1);
            }
          '

      - run: npm ci

      # ripgrep — needed by scripts/check-theme-tokens.sh, which
      # fail-closes without it (preflight `command -v rg`). age is NOT
      # installed here — only `check-shard` runs the integration suite
      # that requires it.
      #
      # Pinned release binary rather than `apt-get update && apt-get
      # install -y ripgrep`, matching the OSV-Scanner and actionlint
      # installs below. apt was both slower and erratic: five sampled
      # runs took 10s, 10s, 15s, 52s and 54s, the long tail being
      # azure.archive.ubuntu.com stalling on a 1.5 MB download. A
      # SHA-pinned tarball is ~2s and has no mirror dependency.
      # Version + checksum are Renovate-tracked via the annotation
      # below so the pin cannot rot silently (ADR-0027 §Decision.1).
      - name: Install ripgrep
        run: |
          set -euo pipefail
          # ripgrep's git tag carries no `v` — `version` is the tag verbatim,
          # as the digest lookup requires, and the asset name embeds it as-is.
          #
          # Nothing may sit between the annotation and `version=` — the
          # customManager regex joins them with `\s+`, so an interposed
          # comment silently drops the pin out of tracking.
          # renovate: datasource=github-release-attachments depName=BurntSushi/ripgrep
          version="15.2.0"
          expected_sha="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
          asset="ripgrep-${version}-x86_64-unknown-linux-musl"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${version}/${asset}.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/ripgrep.tar.gz "$url"
          actual_sha=$(sha256sum /tmp/ripgrep.tar.gz | awk '{print $1}')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::ripgrep tarball SHA256 mismatch — expected $expected_sha got $actual_sha"
            exit 1
          fi
          tar -xzf /tmp/ripgrep.tar.gz -C /tmp "${asset}/rg"
          sudo mv "/tmp/${asset}/rg" /usr/local/bin/rg
          rg --version

      # Allowlist schema gate (ADR-0027 §Negative; runbook §Allowlist).
      # Scanners enforce only the advisory ID; owner/reason/expiry are
      # convention. This gate makes the convention machine-enforced so a
      # sloppy entry cannot land. ~100ms; runs before OSV-Scanner so the
      # cheap check fails fast.
      - name: Check allowlist schema (osv-scanner.toml + .trivyignore)
        run: bash scripts/check-allowlist-schema.sh

      - name: Check allowlist schema — self-test
        run: bash scripts/__tests__/check-allowlist-schema.test.sh

      # OSV-Scanner (ADR-0027 §Decision.2) — replaces `npm audit`. OSV.dev
      # ingests GHSA and covers transitive OS-level CVEs the registry index
      # does not surface.
      #
      # It is NOT a strict superset of npm audit, which this comment used
      # to claim. Both key on (ecosystem, name, version), so neither can
      # see an advisory that has no npm-ecosystem record — and the two
      # databases ingest at different times, so each carries records the
      # other lacks. The "Repo-level advisory check" step below is the
      # layer that covers what neither reaches (#345, ADR-0027
      # § 2026-08-28 amendment).
      #
      # Inline-in-the-job CLI install instead of
      # google/osv-scanner-action because that action only ships reusable
      # workflows (separate jobs) and a composite Docker action documented
      # as "not intended to be used directly" — neither fits an inline step.
      # Binary pinned by SHA256; version + checksum are Renovate-tracked
      # via the `# renovate:` annotation below, so the pin cannot rot
      # silently (ADR-0027 §Decision.1). A stale scanner reports green
      # while no longer knowing about new advisories.
      #
      # Scans the lockfile only (PR-time gate). Full-tree scheduled scan
      # lives in .github/workflows/security-scheduled.yml.
      # Allowlist: osv-scanner.toml (empty baseline; entries require owner +
      # reason + ignoreUntil ≤90d per ADR-0027 §Negative).
      - name: Install OSV-Scanner CLI
        run: |
          set -euo pipefail
          # renovate: datasource=github-release-attachments depName=google/osv-scanner
          version="v2.3.8"
          expected_sha="bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
          url="https://github.com/google/osv-scanner/releases/download/${version}/osv-scanner_linux_amd64"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/osv-scanner "$url"
          actual_sha=$(sha256sum /tmp/osv-scanner | awk '{print $1}')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::OSV-Scanner binary SHA256 mismatch — expected $expected_sha got $actual_sha"
            exit 1
          fi
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: OSV-Scanner (lockfile, fail on any vuln)
        # `scan source` is the subcommand for source-tree scans (lockfiles,
        # SBOMs, manifests). --lockfile pins the input to package-lock.json.
        # --config points at the repo allowlist. Default exit code on
        # vuln-found is non-zero, which fails the step and blocks the PR.
        #
        # NOTE on severity: osv-scanner v2.3.8 has no --severity flag. The
        # gate fails on ANY vuln OSV.dev knows about, regardless of CVSS.
        # This is stricter than ADR-0027's original "HIGH/CRITICAL" wording
        # and aligns with the project's "refuse-or-block, never downgrade"
        # principle (CLAUDE.md). False positives go through
        # osv-scanner.toml with the documented owner/reason/expiry schema.
        run: osv-scanner scan source --lockfile=./package-lock.json --config=./osv-scanner.toml

      # Repo-level advisory layer (ADR-0027 § 2026-08-28 amendment).
      # OSV-Scanner and npm audit both key on (ecosystem, name, version),
      # so an advisory that never gets an npm-ecosystem record is invisible
      # to both. #345 is the proof: fastify's CVE-2026-16732 reached `main`
      # with every gate green, because its OSV record carries a GIT range
      # and no package field, and its GHSA is repo-level only. This step
      # reads each direct dep's repo-level advisories, which is where such
      # an advisory does exist.
      #
      # Needs a token for the per-repo listing: 50 repos does not fit in
      # the anonymous 60 req/h. github.token is read-only on public repo
      # data and is not exposed to the checkout.
      #
      # On the global /advisories/{ghsa_id} probe, github.token answers
      # 403 where a PAT answers 404 — i.e. exactly for the repo-level-only
      # advisories this gate is about. The script downgrades those probes
      # to anonymous requests (the DB is public) and reports when it does.
      # See its GLOBAL PROBES header.
      #
      # Fails closed — a network error exits 2 rather than reporting clean.
      - name: Repo-level advisory check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-repo-advisories.mjs

      - name: Repo-level advisory check — self-test
        run: bash scripts/__tests__/check-repo-advisories.test.sh

      # Trivy source-tree scans land in `lint` (not in `docker`) so they
      # run on every PR regardless of which paths changed. The `docker`
      # job below is path-filtered and pull-request-only — leaving secret
      # + IaC scans there would skip them on every TS-only / docs / e2e
      # PR (the majority class), making the gate informational rather
      # than blocking. Branch protection requires `lint`; `docker`
      # provides only the image-vuln scan + compose validation.
      #
      # Allowlist: .trivyignore (entries gated by check-allowlist-schema
      # above; empty baseline).
      - name: Trivy — filesystem secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          # No `severity:` filter — many of Trivy's built-in secret
          # rules (jwt-token, age-secret-key, slack-web-hook, etc.)
          # ship at MEDIUM and would be silently dropped by HIGH/
          # CRITICAL. Within scanned files, ANY rule match is a block.
          #
          # Residual coverage gap (Trivy v0.70.0 built-in skip list,
          # NOT overridden here): skipDirs `.git`, `node_modules`;
          # skipFiles `package-lock.json` + other lockfiles; skipExts
          # `.svg`, `.pdf`, `.zip`, `.gz`, `.bin`, …; built-in allow-
          # rules that skip paths matching `test`/`example`/`vendor`/
          # `.md`/`/locales/` globally. A secret committed inside any of
          # those slips through — supplement with pre-commit hooks or
          # a complementary scanner (gitleaks/trufflehog) if that gap
          # matters operationally.
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Trivy — IaC misconfig scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # IaC has the noisiest baseline of the three Trivy scans —
          # the HIGH/CRITICAL filter keeps the signal-to-noise workable.
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Lint
        run: npm run lint

      # H5 audit: shellcheck on every .sh under scripts/ and
      # .github/actions/ (composite-action procedures live in real script
      # files precisely so this gate reaches them). Calls the runner's
      # pre-installed shellcheck binary directly — the
      # ludeeus/action-shellcheck wrapper was abandoned upstream
      # (2023-01-29) and added nothing over `find | shellcheck`.
      # Mirrored in .husky/pre-push.
      - name: Shellcheck
        run: |
          shellcheck --version
          find scripts .github/actions -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning

      # actionlint — the workflow-file counterpart to the shellcheck step
      # above: expression type-checking, `needs:`/`uses:` graph validation,
      # `with:` inputs cross-checked against local composite actions, plus
      # shellcheck over every `run:` block. Nothing validated these before,
      # so a typo'd expression or a renamed action input only surfaced as a
      # red run.
      #
      # Scope: .github/workflows/ ONLY. actionlint does not read composite
      # action.yml files — auto-discovery skips them, and passing one
      # explicitly parses it as a workflow (`"jobs" section is missing`).
      # The shell inside .github/actions/ is covered by the step above.
      #
      # --severity=warning matches the shellcheck step's threshold; without
      # it actionlint reports `info`-level noise the project does not gate on.
      #
      # Binary pinned by SHA256, same pattern (and same reason) as the
      # OSV-Scanner install above: upstream ships only a Docker action,
      # which cannot be SHA-pinned in `uses:`. Version + checksum are
      # Renovate-tracked via the `# renovate:` annotation below.
      - name: Install actionlint
        run: |
          set -euo pipefail
          # renovate: datasource=github-release-attachments depName=rhysd/actionlint
          version="v1.7.12"
          expected_sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          # Tag carries the `v`, the asset name does not.
          url="https://github.com/rhysd/actionlint/releases/download/${version}/actionlint_${version#v}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/actionlint.tar.gz "$url"
          actual_sha=$(sha256sum /tmp/actionlint.tar.gz | awk '{print $1}')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::actionlint tarball SHA256 mismatch — expected $expected_sha got $actual_sha"
            exit 1
          fi
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Actionlint (workflows)
        run: actionlint -shellcheck 'shellcheck --severity=warning'

      - name: Format check
        run: npm run format:check

      # Enforce AC-108 — palette and semantic tokens live in a single source
      # (src/styles/tokens.css); state colors from stateConfig.ts are the one
      # documented exception. Runs before type-check so a token leak fails
      # fast and is not hidden behind a tsc error elsewhere.
      - name: Check theme token hygiene
        run: npm run check:tokens

      # Enforce AC-343 — the role-permission matrix in docs/spec/api.md
      # §14.3 is generated from ROLE_PERMISSIONS (src/config/permissions.ts),
      # not hand-authored. Fails the build when the published table and the
      # source config diverge.
      - name: Permissions doc drift check (AC-343)
        run: npm run check:permissions-doc

      - name: Permissions doc drift check — self-test
        run: bash scripts/__tests__/check-permissions-doc.test.sh

      # Enforce AC-349 — the per-role nav matrix in docs/spec/ui/index.md
      # §8.7.1 is generated from ROUTE_DEFINITIONS (src/config/routes.ts).
      # Only the derivable columns are generated; the per-view prose below
      # the end marker is hand-written spec intent and stays untouched.
      - name: Nav matrix drift check (AC-349)
        run: npm run check:nav-doc

      - name: Nav matrix drift check — self-test
        run: bash scripts/__tests__/check-nav-doc.test.sh

      - name: Type check
        run: npx tsc --noEmit

      # The root config's `include` stops at `src` — nothing under
      # `scripts/` was type-checked anywhere, so `scripts/tsconfig.json`
      # was editor-only and free to rot (#283: its missing `@/*` mapping
      # went unnoticed until a script reached for an aliased module).
      - name: Type check (scripts)
        run: npx tsc -p scripts/tsconfig.json --noEmit

      # Static check: every var declared in src/server/config/env.ts must
      # be forwarded to the app container via docker-compose.yml's
      # services.app.environment. Regression guard for the #57 failure
      # mode where BOOTSTRAP_ADMIN_* landed in the Zod schema but were
      # forgotten in compose, silently stripping them from the container
      # env at runtime.
      - name: Env drift check (env.ts ↔ docker-compose.yml)
        run: bash scripts/check-env-drift.sh

      # Static check: this workflow's postgres service container and its
      # `Install age` step are each one decision written twice with
      # e2e.yml — Actions has no include mechanism for a service block,
      # and moving the age step into a composite action would hide its
      # pin from Renovate (see the script header). e2e.yml is
      # `workflow_dispatch` only, so an unsynced edit there stays invisible
      # until an operator runs it before a manual deploy.
      - name: Workflow drift check (ci.yml ↔ e2e.yml)
        run: bash scripts/check-workflow-drift.sh

      - name: Workflow drift check — self-test
        run: bash scripts/__tests__/check-workflow-drift.test.sh

      # Truth table for notify.yml's `Classify run` step, executed
      # against the step's real shell body extracted out of the
      # workflow. `workflow_run` only fires from the default-branch
      # copy of a file, so notify.yml cannot be exercised on a PR
      # branch the way its predecessor was — this is the only
      # pre-merge evidence that its state/route logic is right.
      - name: Notify classification — truth table
        run: bash scripts/__tests__/notify-classify.test.sh

      # Static check: every `expected_sha` binary pin in .github/workflows
      # is actually matched by a Renovate customManager. The manager's
      # regex joins the `# renovate:` annotation to `version=` with `\s+`,
      # so an interposed comment drops the pin out of tracking with no
      # error raised anywhere — it just silently stops advancing, which is
      # the "adopted-already-dying" failure ADR-0027 exists to retire.
      - name: Renovate annotation check
        run: node scripts/check-renovate-annotations.mjs

      - name: Renovate annotation check — self-test
        run: bash scripts/__tests__/check-renovate-annotations.test.sh

      # Static check: every raw INSERT/UPDATE/DELETE on an audited
      # table (project, customer, user, project_worker) must be
      # authored inside the service-layer `mutate()` helper or on the
      # reviewed allowlist (migrations, ImportService, seed loaders,
      # retention cleanup, __tests__). See AC-179 and ADR-0021.
      - name: Audit single-write-path check (mutate() bypass)
        run: bash scripts/check-audit-mutations.sh

      # Static check: every repository path cited in a code span across
      # tracked *.md must exist (AC-347). Renames and deletions leave the
      # prose behind — #289, #292 and #306 each fixed a batch of these by
      # hand. Markdown LINK targets are out of scope here; they belong to
      # the link-checker step.
      - name: Doc path drift check (cited paths exist)
        run: npm run check:doc-paths

      - name: Doc path drift check — self-test
        run: bash scripts/__tests__/check-doc-paths.test.sh

      # Static check: every source file in a directory that ARCHITECTURE.md
      # gives a `#### <dir>` Directory Detail subsection must be named
      # there (AC-350). Coverage only — the `Owns` / `Must NOT` prose is
      # not derivable and is never generated. Ratcheted against
      # scripts/module-map-baseline.txt so new files are gated from day
      # one while #306 burns the existing backlog down.
      - name: Module Map coverage check (AC-350)
        run: npm run check:module-map

      - name: Module Map coverage check — self-test
        run: bash scripts/__tests__/check-module-map.test.sh

      # Static check: every relative file link and `#anchor` fragment
      # across tracked *.md must resolve (AC-348). 25 broken internal
      # links accumulated undetected before #289 — neither `lint` nor
      # `format:check` resolves links.
      #
      # Flags live in lychee.toml, shared with scripts/check-links.sh so
      # a local run and this one cannot diverge. The only argument either
      # passes is `.` — the repository root, NOT a `**/*.md` glob. lychee
      # honours `.gitignore` when walking a directory and not when
      # expanding a glob, so the glob form scanned node_modules/ and
      # failed on 977 links in third-party READMEs. lychee.toml carries
      # the full reasoning.
      #
      # `offline = true` in the config means no network calls: a flaky
      # third-party host cannot fail the lint job.
      #
      # This step's pinned version is also read by
      # scripts/check-links.sh's container fallback — keep the input name
      # `lycheeVersion` if you move it.
      - name: Markdown link check (AC-348)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # renovate: datasource=github-releases depName=lycheeverse/lychee extractVersion=^lychee-(?<version>.*)$
          lycheeVersion: v0.24.2
          args: --config lychee.toml .
          # A run that finds zero links means the walk missed the docs —
          # green for the wrong reason. Fail instead.
          failIfEmpty: true
          jobSummary: false

      # Build also lives in `lint` (not in `check-shard`) so it doesn't
      # pad the test shards' critical path. `npm run build` is
      # `tsc --noEmit && vite build && build:server` — the tsc step
      # duplicates the Type check above, accepted ~5s of dup for the
      # cleaner job graph. No DB/MinIO needed.
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # Test pillar — sharded across 2 runners to halve the wall-clock.
  # Each shard owns its own postgres service + MinIO; per-fork DB
  # isolation in src/test/integration-setup.ts already prevents
  # cross-fork collisions WITHIN a shard, and cross-shard collisions
  # are impossible because each shard runs on its own runner (= its
  # own postgres / MinIO instances).
  #
  # The aggregator job below (`check`) is the stable required-check
  # name the Ruleset depends on — shard-count changes only touch its
  # `needs:` list, never the Ruleset.
  # ---------------------------------------------------------------
  check-shard:
    runs-on: ubuntu-latest

    strategy:
      # All shards run even if one fails — operator gets the full
      # failure picture in one pass instead of a fail-fast cascade
      # where the second shard never reports.
      fail-fast: false
      matrix:
        shard: [1, 2]

    # Duplicated verbatim in e2e.yml, comments aside — Actions cannot
    # factor a service block out of two jobs that share nothing else, so
    # scripts/check-workflow-drift.sh (a step in the `lint` job)
    # fails the build when they diverge. Edit both blocks together.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # POSTGRES_DB defaults to POSTGRES_USER, so omitting it yields
          # a `pm` database. Vitest integration tests don't use it
          # directly — `src/test/integration-setup.ts` creates per-fork
          # `projekt_manager_test_<pid>` databases on demand from the
          # `pm` superuser. The base DB only needs to be reachable for
          # connection-string parsing and pool warm-up.
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # `-h 127.0.0.1` — TCP, not pg_isready's default unix socket. The
        # image's entrypoint runs an init-phase temporary server with
        # `listen_addresses=''` to create the role and database, so a socket
        # probe reports healthy while TCP is still closed. The runner gates
        # the steps below on this probe and then connects over the mapped
        # port, so the socket form can release the job into a refused
        # connection — a red `check` for a reason unrelated to the diff.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pm -d pm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # age — needed by src/test/integration-setup.ts, which generates a
      # per-fork binary identity via `age-keygen` before vitest's
      # integration suite runs (ADR-0024). Not preinstalled on
      # ubuntu-latest. ripgrep lives in `lint` only (theme-token check).
      #
      # Pinned release tarball rather than apt, for the same reason as
      # ripgrep in `lint`: this was the only apt dependency left on the
      # critical path of the longest job, exposed to the same
      # azure.archive.ubuntu.com long tail. Upstream ships no checksum
      # asset (only Sigsum `.proof` files), so the digest is the tarball's
      # own SHA256 — which is what `github-release-attachments` resolves
      # by hashing release assets when no checksum file matches.
      - name: Install age
        run: |
          set -euo pipefail
          # renovate: datasource=github-release-attachments depName=FiloSottile/age
          version="v1.3.1"
          expected_sha="bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377"
          url="https://github.com/FiloSottile/age/releases/download/${version}/age-${version}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/age.tar.gz "$url"
          actual_sha=$(sha256sum /tmp/age.tar.gz | awk '{print $1}')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::age tarball SHA256 mismatch — expected $expected_sha got $actual_sha"
            exit 1
          fi
          # Tarball roots at `age/`. Both binaries are needed: the suite
          # shells out to `age-keygen`, the route layer to `age`.
          #
          # /usr/bin, NOT /usr/local/bin — the code resolves both by
          # absolute path (AGE_KEYGEN_BIN in storage/binaryIdentity.ts,
          # AGE_BINARY in services/KeyEnvelopeService.ts) so a hijacked
          # PATH cannot swap the crypto binary. That makes the install
          # location load-bearing: anywhere else and every wrap/unwrap
          # fails with `spawn /usr/bin/age ENOENT`.
          tar -xzf /tmp/age.tar.gz -C /tmp age/age-keygen age/age
          sudo mv /tmp/age/age-keygen /tmp/age/age /usr/bin/
          /usr/bin/age-keygen --version
          /usr/bin/age --version

      # Storage — MinIO + full bucket/IAM provisioning. Rationale, image
      # pins and readiness handling live in the action; see
      # .github/actions/start-minio/action.yml. The boot-time bucket-safety
      # probe in src/server/storage/safety.ts plus the integration arm of
      # src/server/__tests__/storage-safety.test.ts run end-to-end against
      # this MinIO — without the full provisioning the probe correctly
      # fail-closes and CI stops before any test executes.
      - name: Start MinIO
        uses: ./.github/actions/start-minio
        with:
          storage_bucket: projekt-manager
          # Isolated bucket the vitest integration suite targets via
          # src/test/integration-setup.ts. The app user's IAM policy gains the
          # matching ARN so the boot-time bucket-safety probe (which runs
          # against the test bucket once the suite overrides STORAGE_BUCKET)
          # doesn't fail-close with AccessDenied.
          storage_bucket_test: projekt-manager-test
          # Must match STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY below — the
          # capability self-test asserts vitest runs as the restricted app
          # user, not as MinIO root.
          app_access_key: pmappci
          app_secret_key: pmappcisecret

      # `--shard=N/M` partitions the file list across runners. Vitest's
      # built-in sharder is path-hash stable across runs so a flake is
      # reproducible on the same shard.
      #
      # No `--coverage`: the v8 provider instrumented every run and the
      # report was then thrown away — nothing uploads it and no gate
      # reads it. Measured cost on a 4-vCPU runner shape: 86s → 79s per
      # shard. `npm run test:coverage` stays available locally; when a
      # coverage gate becomes load-bearing, wire an aggregator (e.g. the
      # Codecov action) and re-add the flag with a consumer attached.
      - name: Unit and component tests (shard ${{ matrix.shard }}/2)
        run: npm run test -- --shard=${{ matrix.shard }}/2
        env:
          DATABASE_URL: postgresql://pm:postgres@localhost:5432/pm
          # Storage env vars are required by src/server/__tests__/storage.test.ts
          # which fails loud if any is missing (no silent skips — see file
          # header in storage.test.ts). The integration arm of
          # storage-safety.test.ts additionally requires these to be the
          # capability-restricted app user (not root) — the boot probe
          # asserts the running credential cannot destroy versions.
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: projekt-manager
          # Isolated bucket the integration suite re-points STORAGE_BUCKET
          # at (src/test/integration-setup.ts §3). Set explicitly here —
          # matching the docker-compose.minio.yml default — so the bucket
          # name flows through one source of truth instead of relying on
          # the hardcoded fallback in integration-setup.ts.
          STORAGE_BUCKET_TEST: projekt-manager-test
          STORAGE_ACCESS_KEY: pmappci
          STORAGE_SECRET_KEY: pmappcisecret
          # MinIO accepts any region; us-east-1 is the SDK default.
          STORAGE_REGION: us-east-1

  # ---------------------------------------------------------------
  # Aggregator — the stable required-check name the Ruleset depends
  # on. `needs: check-shard` collapses the matrix into one result;
  # `if: !cancelled()` keeps this job running on shard failure so the
  # gate FAILS instead of being SKIPPED (branch protection treats
  # skipped required checks as success, which would silently let a
  # failing shard through). Shard-count changes only touch the
  # `matrix.shard:` array above, never the Ruleset.
  # ---------------------------------------------------------------
  check:
    needs: check-shard
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Verify all shards passed
        run: |
          if [ "${{ needs.check-shard.result }}" != "success" ]; then
            echo "::error::check-shard reported ${{ needs.check-shard.result }} — gating PR"
            exit 1
          fi

  # ---------------------------------------------------------------
  # Detect whether container-relevant files changed in this PR/push.
  # Gates the `docker` job so we do not pay the image-build cost on
  # every commit — most PRs do not touch Docker files at all.
  # ---------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the Pulls API to list changed files on
    # pull_request events. The default GITHUB_TOKEN in this repo does
    # not grant `pull-requests: read`, which surfaces as "Resource not
    # accessible by integration". Grant it explicitly for this job
    # only — `contents: read` stays as the default for everything else.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'Dockerfile.backup'
              - '.dockerignore'
              - 'docker/**'
              - 'docker-compose.yml'
              - 'docker-compose.*.yml'
              - 'package.json'
              - 'package-lock.json'
              # `npm ci` applies these — a patch change rebuilds the
              # image bytes, so the image-vuln scan should re-run.
              - 'patches/**'
              # `npm run build` reads these; the compiled output is
              # baked into the image.
              - 'tsconfig*.json'
              # Self-validation: changes to this workflow (the docker
              # job itself, the drift check, or the cache config) must
              # exercise the docker job once so regressions are caught
              # on the PR that introduces them, not on the next
              # Docker-touching PR.
              - '.github/workflows/ci.yml'
              # The Tier 1 container round-trip and the inputs it cannot
              # be right without (#301). A narrow list, not `src/**`: the
              # rest of the app changes on nearly every PR and does not
              # change what this job proves, but these paths ARE what it
              # proves. `ephemeralPg.ts` and the baseline schema run
              # nowhere else against the real binaries, so without them
              # here a regression in either only surfaces on the next
              # Docker-touching PR. `backup.ts` is listed for the same
              # reason one step removed: the round-trip's verdict is an
              # equality between two `computeManifest` outputs, so
              # `MANIFEST_TABLES` and the checksum formula decide what it
              # compares at all.
              - 'scripts/backup/**'
              - 'src/server/services/ephemeralPg.ts'
              - 'src/server/services/backup.ts'
              - 'src/server/db/migrations/**'

  # ---------------------------------------------------------------
  # Docker validation — runs when container-relevant files changed
  # (PR), unconditionally on merge_group (Ruleset requirement), and
  # unconditionally on workflow_dispatch so operator feature-branch
  # tests see the PR-time signal too — otherwise the docker-bytes
  # gate is only visible at publish time via build-and-push. Push
  # events fire only on `main`, handled by `promote` (re-tag, or
  # rebuild in its fallback) — no PR-style image bytes to validate
  # here. See ADR-0011 for the split rationale.
  #
  # Scans BOTH app and backup images at PR time (#219). The backup
  # image's `FROM ghcr.io/.../projekt-manager:${APP_IMAGE_TAG}` would
  # normally resolve through GHCR — but at PR time that tag does not
  # exist yet (`build-and-push` runs only on push/dispatch). We export
  # the app image as an OCI layout and alias the GHCR reference to it
  # via buildx `build-contexts`, so the backup build resolves locally.
  # Closes the "image-byte CVE surfaces only post-merge" gap that put
  # `main` red in #218.
  # ---------------------------------------------------------------
  docker:
    needs: changes
    # On `merge_group` (queue) events the `docker` context must REPORT
    # success rather than be skipped — merge queue treats a skipped
    # required check as "not yet met" and waits until the response
    # timeout expires (60 min default), then rejects the PR with no
    # actionable signal. So run the job unconditionally on `merge_group`;
    # the path filter only applies on `pull_request`. `workflow_dispatch`
    # gets the same unconditional treatment so the operator's feature-
    # branch test cycle sees the same docker signal a real PR would.
    if: |
      (needs.changes.outputs.docker == 'true' && github.event_name == 'pull_request') ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # `docker compose config --quiet` exits 0 even when a
      # referenced `${VAR}` has no default — it only prints a stderr
      # warning. Capture combined output and fail on
      # "variable is not set" so a newly-referenced `${FOO}` without
      # a `:-` default cannot sail through CI. Carried over from the
      # closed PR #67.
      - name: Validate Compose file references
        env:
          # Placeholders for variables in docker-compose.yml that have
          # no `:-` default. Kept intentionally minimal so adding a new
          # defaultless `${FOO}` trips the "variable is not set" grep
          # below — the whole point of this check. Do NOT add a
          # placeholder here "just in case": if a variable has a `:-`
          # default, leave it out so the check can still catch a
          # future removal of that default.
          POSTGRES_PASSWORD: placeholder
          # Object-storage env, all `:?`-gated in the base file because
          # values are operator-supplied per provider (B2 in prod, the
          # in-compose MinIO mirror in dev). Real deploys source them
          # from `.env` (operator config) and `secrets.env.age` (the
          # secret half).
          STORAGE_ENDPOINT: http://placeholder:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: placeholder
          STORAGE_ACCESS_KEY: placeholder
          STORAGE_SECRET_KEY: placeholder
          # MinIO root + restricted-app credentials — only consumed by
          # the minio overlay. `:?`-gated there for the same operator-
          # must-supply reason.
          MINIO_ROOT_USER: placeholder
          MINIO_ROOT_PASSWORD: placeholder
          MINIO_APP_ACCESS_KEY: placeholder
          MINIO_APP_SECRET_KEY: placeholder
          CLOUDFLARE_API_TOKEN: placeholder
          # APP_IMAGE_TAG is `:?`-gated — mutable branch tag defaults
          # were removed. A placeholder lets `docker compose config`
          # parse; real deploys pass a SHA tag via scripts/deploy.sh.
          APP_IMAGE_TAG: placeholder
          # DOMAIN is `:?`-gated at the first reference in the caddy
          # service. Real deploys supply it via `.env`; CI needs any
          # non-empty value so compose can parse.
          DOMAIN: placeholder
        run: |
          set -euo pipefail
          check() {
            local label=$1
            shift
            local out
            if ! out=$(docker compose "$@" config --quiet 2>&1); then
              echo "::error::$label: docker compose config failed"
              echo "$out"
              exit 1
            fi
            if echo "$out" | grep -q 'variable is not set'; then
              echo "::error::$label: compose references an unset variable without a default"
              echo "$out" | grep 'variable is not set'
              exit 1
            fi
          }
          check "prod compose" -f docker-compose.yml
          check "prod + minio overlay" -f docker-compose.yml -f docker-compose.minio.yml
          check "prod + minio + dev overlays" -f docker-compose.yml -f docker-compose.minio.yml -f docker-compose.dev.yml
          # Exercise the backup profile once so variable substitution
          # inside the backup service's environment block is covered.
          check "prod compose, backup profile" -f docker-compose.yml --profile backup
          # …and once with the dev overlay, which is where the backup
          # service's `build:` stanza lives. The prod-only case above
          # never renders it, so a typo in its context/args would ship
          # unnoticed until a developer ran the build by hand.
          check "dev overlays, backup profile" -f docker-compose.yml -f docker-compose.minio.yml -f docker-compose.dev.yml --profile backup
          echo "Compose files validated."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Build the production app image with layer caching. Caddy
      # has its own build context (./docker/caddy) with a custom
      # xcaddy + pinned plugin SHA that adds ~60s of Go compile and
      # rarely changes — documented accepted gap. If a Caddy build
      # regression slips through, the deploy workflow's image build
      # on the VPS is the backstop.
      #
      # `cache-to` carries `ignore-error=true` on every site below
      # (and in build-scan-push composite). The GHA cache backend
      # returns transient 502s under load; treating cache-export as
      # load-bearing converts that into a hard build failure even
      # though the image bytes were already assembled. The cache is
      # best-effort; missing it costs ~30s on the next cold build.
      - name: Build app image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: false
          # `load: true` exports the built image into the runner's local
          # Docker daemon (instead of leaving it only in the buildx
          # cache). Trivy's image scan below resolves `image-ref` via the
          # local daemon, so it must be loaded. Mutually exclusive with
          # multi-platform builds, but this build is amd64-only.
          load: true
          tags: projekt-manager-app:ci
          # Bake the PR-tip commit SHA into the client bundle for the
          # footer version chip. On `pull_request` events, `github.sha`
          # points at the synthetic merge commit; we want the head SHA
          # so the chip identifies the bytes the contributor is actually
          # iterating on. Falls back to `github.sha` for non-PR events
          # (workflow_dispatch still exercises this job).
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Trivy image-vuln scan against the locally-built image
      # (ADR-0027 §Decision.2). Filesystem-secret + IaC scans live in
      # the `lint` job above so they run on every PR; this job is
      # path-filtered and would skip them on the majority of PRs.
      # Allowlist: .trivyignore (entries gated by the schema check in
      # `lint`; empty baseline). HIGH/CRITICAL only — image scans
      # otherwise drown in LOW-severity OS-package noise.
      #
      # No `ignore-unfixed`: per the project's refuse-or-block-never-
      # downgrade principle, a no-fix-yet CVE is still a finding. If
      # one becomes operationally tolerable, the entry goes in
      # .trivyignore with owner/reason/exp ≤90d — same machinery as
      # the rest of the allowlist.
      - name: Trivy — app image vuln scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: projekt-manager-app:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      # Export the app image as an OCI layout so the backup build
      # below can resolve `FROM ghcr.io/.../projekt-manager:<tag>`
      # without the tag existing on GHCR (the registry copy only
      # exists post-merge). buildx re-uses every layer from the
      # previous app build via the shared gha cache, so this adds
      # only the tar-export cost (~5–10s on warm cache).
      - name: Export app image as OCI layout (for backup build context)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          outputs: type=oci,dest=/tmp/app-image-oci.tar
          # Match the SHA passed to the `Build app image` step above so
          # buildx re-uses the same cached layers instead of rebuilding
          # for an empty-GIT_SHA cache key.
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # buildx's `oci-layout://` named-context source reads a
      # directory, not a tarball, so unpack before the next build.
      - name: Extract OCI layout
        run: |
          set -euo pipefail
          mkdir -p /tmp/app-oci
          tar -xf /tmp/app-image-oci.tar -C /tmp/app-oci

      # Build the backup image at PR time so its CVE surface is
      # gated before merge (#219). The `FROM` reference in
      # Dockerfile.backup is intercepted by buildx's `build-contexts`
      # and resolved to the OCI layout exported above — no GHCR
      # round-trip and no Dockerfile.backup change. APP_IMAGE_TAG=oci
      # is a sentinel matching the suffix in `build-contexts` so the
      # `FROM` resolves; it is never pushed anywhere. Separate gha
      # cache scope mirrors `build-and-push` so the backup image's
      # layer cache stays isolated from the app image's.
      - name: Build backup image (FROM aliased to OCI layout)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.backup
          push: false
          load: true
          tags: projekt-manager-backup:ci
          build-args: |
            APP_IMAGE_TAG=oci
          build-contexts: |
            ghcr.io/projekt-manager-org/projekt-manager:oci=oci-layout:///tmp/app-oci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup,ignore-error=true

      - name: Trivy — backup image vuln scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: projekt-manager-backup:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      # Tier 1 round-trip against the real initdb / pg_dump / pg_restore
      # (#301 scope C). This job is the only place those binaries exist:
      # they ship in the backup image and on no runner, so the host suite
      # can pin their argv but never execute them.
      #
      # Here rather than in `check`, and as a script rather than a vitest
      # case, for the reasons in the script header — `check-shard` has no
      # compose stack, and this needs the image the step above just built.
      #
      # No postgres/MinIO service containers and no start-minio call: the
      # script owns its own on a private network with no published ports,
      # which is what lets the identical command run on a dev machine.
      # ~10s, entirely container-to-container.
      # Bounded because every wait *inside* the script is (60s readiness,
      # 30s bucket provisioning, SUBPROCESS_TIMEOUT_MS per binary) but the
      # `docker run` calls themselves are not — a wedged daemon would
      # otherwise burn the job's 360-minute default before reporting.
      - name: Tier 1 round-trip (real Postgres binaries)
        timeout-minutes: 10
        env:
          BACKUP_IMAGE: projekt-manager-backup:ci
        run: bash scripts/backup/verify-roundtrip.sh

  # ---------------------------------------------------------------
  # Build, scan, smoke, and push the production images to GHCR.
  # Single source of truth lives in .github/actions/build-scan-push —
  # this job is the entry point for `workflow_dispatch` (operator
  # feature-branch dispatch). Pushes to `main` go through `promote`
  # below instead;
  # `promote` re-tags the dispatched artifact rather than rebuilding,
  # and falls through to this same composite action if the promote
  # guards fail. See ADR-0011 §"Build once, promote on merge" and
  # #221 for the topology rationale.
  #
  # Gated on `check` + `lint` so we never publish an image from a
  # commit that fails tests, lint, type-check, or static analysis.
  # ---------------------------------------------------------------
  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    needs: [check, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Compute the SHA tag and branch slug for the composite. The
      # SHA tag is the immutable rollback target used by
      # scripts/deploy.sh; the branch-slug tag is the moving
      # "latest on this branch" pointer kept as a human-friendly
      # fallback. See ADR-0012 for the manual pull-based deploy flow.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          # Slugify the branch name for Docker tag legality:
          # lowercase, replace '/' with '-', strip anything not in
          # [a-z0-9._-].
          branch_slug=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]/' '[:lower:]-' | sed 's/[^a-z0-9._-]/-/g')
          {
            echo "sha_tag=sha-${GITHUB_SHA}"
            echo "branch_slug=${branch_slug}"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-scan-push
        with:
          sha_tag: ${{ steps.tags.outputs.sha_tag }}
          branch_slug_tag: ${{ steps.tags.outputs.branch_slug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_actor: ${{ github.actor }}

  # ---------------------------------------------------------------
  # Promote on merge to main: pull the dispatched `sha-<pr-tip>`
  # images, re-tag as `sha-<merge-sha>` + `main`, push. No rebuild,
  # no rescan, no smoke — the bytes are identical to what was
  # validated during `workflow_dispatch` on the PR.
  #
  # Three guards gate the happy path; any failure falls through to
  # the rebuild composite (same code path the dispatch ran):
  #   1. Merge SHA must trace back to a merged PR (gh api).
  #   2. tree(merge-sha) must equal tree(pr-tip) — guards against
  #      non-squash merges (the repo enables merge-commit + rebase
  #      alongside squash; either could pull in main and diverge).
  #   3. `sha-<pr-tip>` image must exist on GHCR — guards against
  #      Renovate auto-merge / force-push-then-merge / dispatch
  #      simply skipped.
  #
  # See ADR-0011 §"Build once, promote on merge" and #221.
  # ---------------------------------------------------------------
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # gh api repos/.../commits/<sha>/pulls needs this scope on
      # private repos. Read-only — the promote path never writes
      # to PR data.
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve PR-tip + verify guards
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          merge_sha="${GITHUB_SHA}"
          echo "merge SHA: $merge_sha"

          # Guard 1: merge SHA must be a PR merge. Direct pushes to
          # main (hot-fix, manual force-push) return an empty array.
          pr_head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${merge_sha}/pulls" \
                    --jq '.[0].head.sha // empty')
          if [ -z "$pr_head" ]; then
            echo "::warning::No PR found for merge SHA ${merge_sha} — falling back to rebuild"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR-tip SHA: $pr_head"

          # Guard 2: tree equality. Squash merges preserve tree;
          # merge-commit / rebase merges that incorporated main can
          # produce a merge-commit tree that differs from the PR-tip
          # tree, in which case the `sha-<pr-tip>` image bytes do
          # NOT match what HEAD contains.
          merge_tree=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${merge_sha}" --jq '.commit.tree.sha')
          pr_tree=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${pr_head}" --jq '.commit.tree.sha')
          echo "merge tree:  $merge_tree"
          echo "PR-tip tree: $pr_tree"
          if [ "$merge_tree" != "$pr_tree" ]; then
            echo "::warning::Tree mismatch (non-squash merge or main divergence) — falling back to rebuild"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard 3: source tag must exist on GHCR. dispatch may have
          # been skipped entirely (Renovate auto-merge, direct push,
          # operator forgot), or fired against an earlier PR-tip SHA
          # that was force-pushed away before merge. `docker manifest
          # inspect` is a lightweight HEAD-equivalent — no pull.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in projekt-manager projekt-manager-backup; do
            ref="ghcr.io/${owner}/${img}:sha-${pr_head}"
            if ! docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "::warning::Source image ${ref} not found on GHCR — falling back to rebuild"
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # All three guards passed.
          {
            echo "fallback=false"
            echo "pr_tip=${pr_head}"
            echo "owner=${owner}"
          } >> "$GITHUB_OUTPUT"

      # buildx is needed for `imagetools create` below. Composite
      # action sets it up in the rebuild path; for the promote path
      # we set it up here so the cheap-promote happy path doesn't
      # carry an unrelated dependency on the composite.
      - name: Set up Docker Buildx
        if: steps.resolve.outputs.fallback == 'false'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Promote — registry-level re-tag (preserves index + attestations)
        if: steps.resolve.outputs.fallback == 'false'
        env:
          PR_TIP: ${{ steps.resolve.outputs.pr_tip }}
          OWNER: ${{ steps.resolve.outputs.owner }}
        run: |
          set -euo pipefail
          merge_sha="${GITHUB_SHA}"
          # GITHUB_REF_NAME on push:main is `main` — no slugification
          # needed; included for parity with build-and-push and to
          # tolerate future changes to the target branch name.
          branch_slug=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]/' '[:lower:]-' | sed 's/[^a-z0-9._-]/-/g')

          for img in projekt-manager projekt-manager-backup; do
            src="ghcr.io/${OWNER}/${img}:sha-${PR_TIP}"
            sha_dst="ghcr.io/${OWNER}/${img}:sha-${merge_sha}"
            slug_dst="ghcr.io/${OWNER}/${img}:${branch_slug}"

            echo "::group::Promote ${img}"
            echo "  source: ${src}"
            echo "  -> ${sha_dst}"
            echo "  -> ${slug_dst}"
            # `docker buildx imagetools create` copies the manifest
            # at the registry level — no pull, no local Docker
            # daemon involvement. Preserves the OCI image-index
            # wrapper (mediaType `application/vnd.oci.image.index.v1+json`)
            # and the buildx-generated provenance/SBOM attestation
            # manifests, which `docker pull + tag + push` would
            # silently drop (the daemon only handles platform-
            # specific manifests, not index + attestation tuples).
            # Regression observed on the first promote run in #226
            # — sha-<merge> ended up as schema-2 with the
            # attestation manifest gone; bytes ran fine but a future
            # `cosign verify` or SLSA-verify gate would fail.
            docker buildx imagetools create \
              -t "${sha_dst}" \
              -t "${slug_dst}" \
              "${src}"
            echo "::endgroup::"
          done

      # Fallback path: any guard failure flips fallback=true. Run
      # the same composite the dispatch path uses, against the
      # merge SHA. Cache scope is main's (cold relative to the
      # dispatch's feature-branch scope), so expect wall-clock
      # comparable to a fresh main build.
      - name: Compute tags for fallback rebuild
        if: steps.resolve.outputs.fallback == 'true'
        id: fallback_tags
        run: |
          set -euo pipefail
          branch_slug=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]/' '[:lower:]-' | sed 's/[^a-z0-9._-]/-/g')
          {
            echo "sha_tag=sha-${GITHUB_SHA}"
            echo "branch_slug=${branch_slug}"
          } >> "$GITHUB_OUTPUT"

      - name: Fallback — full build + scan + smoke + push
        if: steps.resolve.outputs.fallback == 'true'
        uses: ./.github/actions/build-scan-push
        with:
          sha_tag: ${{ steps.fallback_tags.outputs.sha_tag }}
          branch_slug_tag: ${{ steps.fallback_tags.outputs.branch_slug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_actor: ${{ github.actor }}
