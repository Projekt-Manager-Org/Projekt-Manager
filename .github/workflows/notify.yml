# CI alerts: GitHub emails a failed run only to its triggering actor, and
# Renovate's automerge makes that the bot. A red PR is assigned to the
# maintainer; a workflow red on main gets one issue. Both clear on green. What
# alerts nobody: docs/ops/dep-management.md § Weekly wrangler. `workflow_run` is
# privileged: no checkout, and untrusted values reach the shell only via `env:`.
name: Notify

on:
  workflow_run:
    workflows: # By NAME: scripts/check-notify-coverage.sh fails the PR that unhooks one.
      - CI
      - Security (scheduled)
      - E2E
      - GHCR retention
      - Inventory scan
      - Renovate health
      - Deploy pending
      - Docker host advisories
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: notify-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false # Two runs at once would race the open-issue lookup.

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
  RUN_ID: ${{ github.event.workflow_run.id }}
  RUN_URL: ${{ github.event.workflow_run.html_url }}
  RUN_EVENT: ${{ github.event.workflow_run.event }}
  CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  MAINTAINER: vlzware # Assigning the org (`github.repository_owner`) is a 422.
  RED_LABEL: ci-red
  # Reports one merge, not a state: a later green proves nothing, so its issue is closed by hand.
  EVENT_SCOPED: Deploy pending

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Classify run
        id: classify
        run: |
          set -euo pipefail
          # `cancelled` proves nothing: a force-push supersedes PR runs.
          case "$CONCLUSION" in
            success)                          state='green' ;;
            failure|timed_out|startup_failure) state='red' ;;
            *)                                state='ignore' ;;
          esac
          # By event: `commits/{sha}/pulls` resolves a squashed commit on main to
          # its merged PR. Branch dispatches and merge-queue runs land in `none`.
          if [ "$RUN_EVENT" = 'pull_request' ]; then route='pr'
          elif [ "$HEAD_BRANCH" = 'main' ]; then route='main'
          else route='none'; fi
          # A timeout concludes `cancelled` (#703). An evicted pending run has no
          # job that ran; a failed lookup is no proof of eviction, so it alerts.
          if [ "$CONCLUSION" = 'cancelled' ] && [ "$route" = 'main' ]; then
            ran=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              | jq -r '[.jobs[] | select((.runner_name // "") != "")] | length > 0') || ran='true'
            if [ "$ran" = 'true' ]; then state='red'; fi
          fi
          pr=''
          if [ "$route" = 'pr' ]; then
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              | jq -r 'map(select(.state == "open")) | first | .number // empty')
            if [ -z "$pr" ]; then route='none'; fi
          fi
          printf 'state=%s\nroute=%s\npr=%s\n' "$state" "$route" "$pr" >> "$GITHUB_OUTPUT"

      # Assigning twice raises one notification, so force-pushes stay silent;
      # clearing on green is what lets the next incident notify.
      - name: Assign on a red PR, clear on green
        if: steps.classify.outputs.route == 'pr' && steps.classify.outputs.state != 'ignore'
        env:
          PR: ${{ steps.classify.outputs.pr }}
          STATE: ${{ steps.classify.outputs.state }}
        run: |
          method=POST
          if [ "$STATE" = 'green' ]; then method=DELETE; fi
          gh api -X "$method" "repos/${GITHUB_REPOSITORY}/issues/${PR}/assignees" -f "assignees[]=${MAINTAINER}" > /dev/null

      # A failed issue lookup fails the step, or it could open a second issue; a
      # failed details lookup still posts. Annotations are third-party text: code
      # spans without backticks, capped (a comment over 65536 characters fails).
      - name: Open, comment on or close the red-main issue
        id: post
        if: steps.classify.outputs.route == 'main' && steps.classify.outputs.state != 'ignore'
        env:
          STATE: ${{ steps.classify.outputs.state }}
        run: |
          set -euo pipefail
          title="${WORKFLOW_NAME} is red on main"
          issues="repos/${GITHUB_REPOSITORY}/issues"
          existing=$(gh api "${issues}?state=open&labels=${RED_LABEL}&per_page=100" \
            | jq -r --arg t "$title" 'map(select(.pull_request == null and .title == $t)) | first | .number // empty')

          if [ "$STATE" = 'green' ]; then
            if [ -n "$existing" ] && [ "$WORKFLOW_NAME" != "$EVENT_SCOPED" ]; then
              gh api -X POST "${issues}/${existing}/comments" -f "body=Green again on ${HEAD_SHA} — ${RUN_URL}" > /dev/null
              gh api -X PATCH "${issues}/${existing}" -f 'state=closed' -f 'state_reason=completed' > /dev/null
            fi
            exit 0
          fi

          list=$(mktemp)
          capped='' unread=''
          failed='.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")'
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100") || { unread=yes; jobs='{"jobs":[]}'; }
          jq -r "$failed"' | .name as $job | .conclusion as $how
            | [(.steps // [])[] | select(.conclusion == "failure") | "\($job) / \(.name)"]
            | if length > 0 then .[] else "\($job) (\($how))" end' <<< "$jobs" > "$list"
          while IFS=$'\t' read -r job url; do
            notes=$(gh api "${url}/annotations?per_page=100" \
              | jq '[.[] | select(.annotation_level == "failure") | .message | gsub("\\s+"; " ")]') || { unread=yes; continue; }
            if [ "$(jq length <<< "$notes")" -ge 10 ]; then capped=yes; fi
            jq -r --arg job "$job" '.[] | select(test("^(Process completed with exit code|The operation was canceled)") | not)
              | "\($job): \(.)"' <<< "$notes" >> "$list"
          done < <(jq -r "$failed | [.name, .check_run_url] | @tsv" <<< "$jobs")
          report=$(
            awk -v max=50 -v width=300 '
              { gsub(/[`\r]/, ""); if (length($0) > width) $0 = substr($0, 1, width) "…" }
              NR <= max { print "- `" $0 "`" }
              END { if (NR > max) print "- … and " NR - max " more in the run" }' "$list"
            if [ -n "$capped" ]; then printf '\nPossibly more errors: GitHub keeps 10 per step.\n'; fi
            if [ -n "$unread" ] || [ ! -s "$list" ]; then printf '\n**Could not read every failure**: see the run.\n'; fi
          )
          head="Still red — ${RUN_URL}"
          closing='It closes itself on the next green run of this workflow.'
          if [ "$WORKFLOW_NAME" = "$EVENT_SCOPED" ]; then
            head="Also red (another merge, \`${HEAD_SHA}\`) — ${RUN_URL}"
            closing='A later green run does not cover this commit: check the run, then close this issue by hand.'
          fi
          if [ -n "$existing" ]; then
            gh api -X POST "${issues}/${existing}/comments" -f "body=$(printf '%s\n\n%s' "$head" "$report")" > /dev/null
          else
            body=$(printf '`%s` concluded **%s** on `main` (%s).\n\n- Run: %s\n- Commit: `%s`\n\n%s\n\n%s' \
              "$WORKFLOW_NAME" "$CONCLUSION" "$RUN_EVENT" "$RUN_URL" "$HEAD_SHA" "$report" "$closing")
            gh api -X POST "$issues" -f "title=${title}" -f "body=${body}" \
              -f "labels[]=${RED_LABEL}" -f "assignees[]=${MAINTAINER}" --jq '.number' > /dev/null
          fi
