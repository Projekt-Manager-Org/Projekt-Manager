name: Push images to GHCR
description: >
  Publishes the app + backup images to GHCR under the supplied SHA tag
  and branch-slug tag. Assumes `build-scan-smoke` has already passed for
  the same `sha_tag` / `git_sha` pair, so on a warm gha cache every layer
  is a hit and this is a re-materialise-and-push. It does NOT assume that
  cache was warm: each image is built into the local store, Trivy-scanned,
  and only then pushed, so a cache miss cannot publish layers nothing
  looked at. Never call it on a path where the images have not been
  smoked — the smoke is `build-scan-smoke`'s and is not repeated here.

inputs:
  sha_tag:
    description: SHA-derived image tag (e.g. `sha-<commit>`). Must match what `build-scan-smoke` was given.
    required: true
  branch_slug_tag:
    description: Branch-slug human-friendly fallback tag (e.g. `main`, `233-live-activity-dock`).
    required: true
  git_sha:
    description: >
      Commit SHA baked into the client bundle. Must match what
      `build-scan-smoke` was given — it is part of the cache key, so a
      mismatch turns this into a full rebuild of different bytes than were
      validated. The Trivy steps below keep that from reaching GHCR
      unscanned, but the published image would still not be the smoked one.
    required: true
  github_token:
    description: GHCR auth token. Pass `secrets.GITHUB_TOKEN`.
    required: true
  github_actor:
    description: GHCR username. Pass `github.actor`.
    required: true

runs:
  using: composite
  steps:
    - name: Compute full tag lists
      id: tags
      shell: bash
      run: |
        set -euo pipefail
        # GHCR rejects uppercase in the repository path, so lowercase
        # the owner (the org name `Projekt-Manager-Org` is mixed-case).
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        {
          echo "app_tags<<APP_TAGS_EOF"
          echo "ghcr.io/${owner}/projekt-manager:${{ inputs.sha_tag }}"
          echo "ghcr.io/${owner}/projekt-manager:${{ inputs.branch_slug_tag }}"
          echo "APP_TAGS_EOF"
          echo "backup_tags<<BACKUP_TAGS_EOF"
          echo "ghcr.io/${owner}/projekt-manager-backup:${{ inputs.sha_tag }}"
          echo "ghcr.io/${owner}/projekt-manager-backup:${{ inputs.branch_slug_tag }}"
          echo "BACKUP_TAGS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ inputs.github_actor }}
        password: ${{ inputs.github_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    # Build → scan → push, per image. The scan is NOT redundant with
    # `build-scan-smoke`'s: that job runs on a different runner with a
    # different buildx container, and the only thing linking the two is
    # the gha cache — which carries `ignore-error=true` on export
    # precisely because the backend returns transient 502s under load. A
    # silently-dropped export means this action starts cold and re-runs
    # `apk upgrade --no-cache` / `apk add --no-cache` (Dockerfile:74,
    # Dockerfile.backup:107), resolving whatever Alpine package versions
    # are current at that instant. Without a scan here those layers reach
    # GHCR unlooked-at, and `promote` re-tags them to `sha-<merge>` +
    # `main` without a rescan. Scanning what we are about to push makes
    # the guarantee hold on a cache miss instead of assuming the hit.
    #
    # The local build costs ~0 on the warm path: the push build below
    # reuses this build's result straight out of the builder's own cache.
    #
    # No `cache-to` at any site here. `build-scan-smoke` already exported
    # both scopes for this ref moments ago, nothing reads a second copy
    # (the next commit invalidates it and `cache-cleanup.yml` reaps the
    # PR ref's caches on close), and the export competes for the same
    # 10 GB per-repo cap whose eviction pressure is what makes the cold
    # start above possible in the first place.
    - name: Build app image (load locally for scan)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile
        push: false
        load: true
        tags: projekt-manager-app:ci
        build-args: |
          GIT_SHA=${{ inputs.git_sha }}
        cache-from: type=gha

    # HIGH/CRITICAL only, no `ignore-unfixed`, allowlist in .trivyignore —
    # same policy as `build-scan-smoke`; see that action for the rationale.
    - name: Trivy — app image vuln scan (HIGH/CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: projekt-manager-app:ci
        severity: HIGH,CRITICAL
        exit-code: '1'
        trivyignores: .trivyignore

    - name: Push app image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.tags.outputs.app_tags }}
        build-args: |
          GIT_SHA=${{ inputs.git_sha }}
        cache-from: type=gha

    # Backup image — see ADR-0020 §Decision (Layer 2 encrypted backups)
    # and Dockerfile.backup. Sequential on purpose: Dockerfile.backup's
    # `FROM ghcr.io/...:${APP_IMAGE_TAG}` references the app image pushed
    # by the step above, so that push must complete first.
    # (`build-scan-smoke` resolves the same `FROM` through an OCI-layout
    # alias instead, because at validation time nothing is published.)
    # Separate gha cache scope keeps the backup image's layer cache from
    # invalidating the app image's.
    - name: Build backup image (load locally for scan)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile.backup
        push: false
        load: true
        tags: projekt-manager-backup:ci
        build-args: |
          APP_IMAGE_TAG=${{ inputs.sha_tag }}
        cache-from: type=gha,scope=backup

    - name: Trivy — backup image vuln scan (HIGH/CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: projekt-manager-backup:ci
        severity: HIGH,CRITICAL
        exit-code: '1'
        trivyignores: .trivyignore

    - name: Push backup image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile.backup
        push: true
        tags: ${{ steps.tags.outputs.backup_tags }}
        build-args: |
          APP_IMAGE_TAG=${{ inputs.sha_tag }}
        cache-from: type=gha,scope=backup
