name: Push images to GHCR
description: >
  Publishes the app + backup images to GHCR under the supplied SHA tag
  and branch-slug tag. Assumes `build-scan-smoke` has already passed for
  the same `sha_tag` / `git_sha` pair — every layer is a gha cache hit,
  so this is a re-materialise-and-push, not a fresh build. Never call it
  on a path where the images have not been scanned and smoked.

inputs:
  sha_tag:
    description: SHA-derived image tag (e.g. `sha-<commit>`). Must match what `build-scan-smoke` was given.
    required: true
  branch_slug_tag:
    description: Branch-slug human-friendly fallback tag (e.g. `main`, `233-live-activity-dock`).
    required: true
  git_sha:
    description: >
      Commit SHA baked into the client bundle. Must match what
      `build-scan-smoke` was given — it is part of the cache key, so a
      mismatch silently publishes different bytes than were validated.
    required: true
  github_token:
    description: GHCR auth token. Pass `secrets.GITHUB_TOKEN`.
    required: true
  github_actor:
    description: GHCR username. Pass `github.actor`.
    required: true

runs:
  using: composite
  steps:
    - name: Compute full tag lists
      id: tags
      shell: bash
      run: |
        set -euo pipefail
        # GHCR rejects uppercase in the repository path, so lowercase
        # the owner (the org name `Projekt-Manager-Org` is mixed-case).
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        {
          echo "app_tags<<APP_TAGS_EOF"
          echo "ghcr.io/${owner}/projekt-manager:${{ inputs.sha_tag }}"
          echo "ghcr.io/${owner}/projekt-manager:${{ inputs.branch_slug_tag }}"
          echo "APP_TAGS_EOF"
          echo "backup_tags<<BACKUP_TAGS_EOF"
          echo "ghcr.io/${owner}/projekt-manager-backup:${{ inputs.sha_tag }}"
          echo "ghcr.io/${owner}/projekt-manager-backup:${{ inputs.branch_slug_tag }}"
          echo "BACKUP_TAGS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ inputs.github_actor }}
        password: ${{ inputs.github_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    # `cache-to` carries `ignore-error=true` on both sites: the GHA
    # cache backend returns transient 502s under load (the "Unicorn!"
    # page), and treating cache-export as load-bearing converts that
    # into a hard build failure even though the image bytes were
    # already assembled.
    - name: Push app image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.tags.outputs.app_tags }}
        build-args: |
          GIT_SHA=${{ inputs.git_sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true

    # Backup image — see ADR-0020 §Decision (Layer 2 encrypted backups)
    # and Dockerfile.backup. Sequential on purpose: Dockerfile.backup's
    # `FROM ghcr.io/...:${APP_IMAGE_TAG}` references the app image
    # pushed by the step above, so that push must complete first.
    # (`build-scan-smoke` resolves the same `FROM` through an OCI-layout
    # alias instead, because at validation time nothing is published.)
    # Separate gha cache scope keeps the backup image's layer cache from
    # invalidating the app image's.
    - name: Push backup image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile.backup
        push: true
        tags: ${{ steps.tags.outputs.backup_tags }}
        build-args: |
          APP_IMAGE_TAG=${{ inputs.sha_tag }}
        cache-from: type=gha,scope=backup
        cache-to: type=gha,mode=max,scope=backup,ignore-error=true
