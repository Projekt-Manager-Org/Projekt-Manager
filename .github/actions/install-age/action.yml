name: Install age
description: >
  Installs the `age` and `age-keygen` binaries to /usr/bin from a
  SHA256-pinned upstream release tarball. Single source of truth for the
  pin — called from `ci.yml`'s `check-shard` (the integration suite mints
  a per-fork binary identity, ADR-0024) and from `e2e.yml` (Playwright
  mints one before spawning the webServer).

  Pinned tarball rather than `apt-get install age`, for the same reason as
  ripgrep and OSV-Scanner in `lint`: apt was measured at 10s–54s across
  five runs, the long tail being azure.archive.ubuntu.com stalling, and
  `check-shard` — the longest job in the pipeline — sits behind it. An
  unpinned binary that mints a crypto identity is also a supply-chain
  hole the rest of the pipeline does not have.

runs:
  using: composite
  steps:
    # Upstream ships no checksum asset (only Sigsum `.proof` files), so the
    # digest is the tarball's own SHA256 — which is what
    # `github-release-attachments` resolves by hashing release assets when
    # no checksum file matches.
    #
    # Nothing may sit between the annotation and `version=` — the
    # customManager regex joins them with `\s+`, so an interposed comment
    # silently drops the pin out of tracking.
    # `scripts/check-renovate-annotations.mjs` scans this directory for
    # exactly that.
    - name: Install age
      shell: bash
      run: |
        set -euo pipefail
        # renovate: datasource=github-release-attachments depName=FiloSottile/age
        version="v1.3.1"
        expected_sha="bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377"
        url="https://github.com/FiloSottile/age/releases/download/${version}/age-${version}-linux-amd64.tar.gz"
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/age.tar.gz "$url"
        actual_sha=$(sha256sum /tmp/age.tar.gz | awk '{print $1}')
        if [ "$actual_sha" != "$expected_sha" ]; then
          echo "::error::age tarball SHA256 mismatch — expected $expected_sha got $actual_sha"
          exit 1
        fi
        # Tarball roots at `age/`. Both binaries are needed: the suite
        # shells out to `age-keygen`, the route layer to `age`.
        #
        # /usr/bin, NOT /usr/local/bin — the code resolves both by
        # absolute path (AGE_KEYGEN_BIN in storage/binaryIdentity.ts,
        # AGE_BINARY in services/KeyEnvelopeService.ts) so a hijacked
        # PATH cannot swap the crypto binary. That makes the install
        # location load-bearing: anywhere else and every wrap/unwrap
        # fails with `spawn /usr/bin/age ENOENT`.
        tar -xzf /tmp/age.tar.gz -C /tmp age/age-keygen age/age
        sudo mv /tmp/age/age-keygen /tmp/age/age /usr/bin/
        /usr/bin/age-keygen --version
        /usr/bin/age --version
