name: Build, scan, smoke, and push by digest
description: >
  Builds the app + backup images once, scans both with Trivy, boots the
  stack against those exact bytes, and — only then, and only when the
  caller says the token can write — pushes both to GHCR **by digest**. A
  digest-only manifest carries no tag, so nothing can pull, deploy or
  promote it: `tag-images` is what makes an image reachable by name, and
  it runs after every other gate. Single source of truth for the
  validation half: called from the `docker` job (every PR) and from the
  `promote` job's fallback.

inputs:
  app_repo:
    description: GHCR repository path for the app image, without a tag.
    required: true
  backup_repo:
    description: GHCR repository path for the backup image, without a tag.
    required: true
  sha_tag:
    description: >
      SHA-derived tag the images will carry once `tag-images` runs (e.g.
      `sha-<commit>`). Used as APP_IMAGE_TAG in the smoke compose and as
      the `FROM` reference the backup build resolves against.
    required: true
  git_sha:
    description: Commit SHA baked into the client bundle for the footer version chip.
    required: true
  push_by_digest:
    description: >
      `true` to push both images by digest after the smoke passes. Must be
      false wherever the job's GITHUB_TOKEN is read-only — fork PRs get a
      read-only token whatever the workflow's `permissions:` block says,
      so a fork run validates and pushes nothing.
    required: false
    default: 'false'
  github_token:
    description: GHCR auth token. Pass `secrets.GITHUB_TOKEN`. Unused when not pushing.
    required: false
    default: ''
  github_actor:
    description: GHCR username. Pass `github.actor`. Unused when not pushing.
    required: false
    default: ''

outputs:
  app_digest:
    description: Digest of the pushed app image index. Empty when not pushing.
    value: ${{ steps.push_app.outputs.digest }}
  backup_digest:
    description: Digest of the pushed backup image index. Empty when not pushing.
    value: ${{ steps.push_backup.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Log in to GHCR
      if: inputs.push_by_digest == 'true'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ inputs.github_actor }}
        password: ${{ inputs.github_token }}

    # ---------------------------------------------------------------
    # `cache-to` carries `ignore-error=true` at every site. The GHA cache
    # backend returns transient 502s under load; treating cache export as
    # load-bearing turns that into a hard build failure even though the
    # bytes were already assembled. Missing it costs ~30 s on the next
    # cold build, nothing else.
    #
    # Two exporters, ONE build (buildx ≥0.13 / BuildKit ≥0.13):
    #
    #   type=docker  loads into the runner's local Docker daemon. Trivy
    #                resolves `image-ref` through that daemon, and the
    #                smoke resolves the compose `image:` lines through it.
    #   type=oci     writes the layout the backup build's `FROM` resolves
    #                against — see the `build-contexts` step below.
    #                `tar=false` writes the layout unpacked, so nothing
    #                has to tar it up and untar it again.
    #
    # `provenance: false` on the validation builds, `mode=max` on the
    # pushes below. Not a preference — the `docker` exporter cannot write
    # a manifest list, and an attestation turns the result into one:
    # `ERROR: failed to build: docker exporter does not currently support
    # exporting manifest lists`. GitHub's runners use the classic image
    # store, where that is fatal; a daemon with the containerd image
    # store enabled accepts it, which is exactly why this has to be
    # stated rather than left to a local experiment.
    #
    # Nothing is lost by the asymmetry. An attestation changes how the
    # final image is assembled, not the cache keys of the steps that
    # build it, so the pushing builds below still resolve every layer out
    # of this builder's cache and cost only the registry upload. The
    # published images carry `mode=max` provenance; `tag-images` copies
    # it forward. Setting it explicitly rather than relying on
    # `build-push-action`'s own heuristic keeps the two halves readable.
    #
    # A third `type=image,push-by-digest` exporter in the same build is
    # NOT an option: it makes the OCI layout's index reference a digest
    # whose content the layout does not hold, and the backup build's
    # `FROM` then fails to resolve.
    # ---------------------------------------------------------------
    - name: Build app image (local store + OCI layout)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile
        provenance: false
        outputs: |
          type=docker,name=projekt-manager-app:ci
          type=oci,tar=false,dest=/tmp/app-oci
        build-args: |
          GIT_SHA=${{ inputs.git_sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true

    - name: Trivy — app image
      uses: ./.github/actions/trivy-image
      with:
        image_ref: projekt-manager-app:ci

    # `build-contexts` intercepts Dockerfile.backup's `FROM` and resolves
    # it to the OCI layout above — no GHCR round-trip, and nothing has to
    # be published for the backup image to be buildable. Introduced for
    # the PR-time backup scan in #219 / ADR-0027 §157; it is what lets the
    # whole build → scan → smoke sequence run before anything is pushed.
    # APP_IMAGE_TAG is the real `sha_tag` rather than a sentinel, so the
    # `FROM` recorded in the backup image names the app tag it will be
    # published beside. Separate gha cache scope keeps the backup image's
    # layer cache from invalidating the app image's.
    - name: Build backup image (FROM aliased to the OCI layout)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile.backup
        provenance: false
        outputs: type=docker,name=projekt-manager-backup:ci
        build-args: |
          APP_IMAGE_TAG=${{ inputs.sha_tag }}
        build-contexts: |
          ${{ inputs.app_repo }}:${{ inputs.sha_tag }}=oci-layout:///tmp/app-oci
        cache-from: type=gha,scope=backup
        cache-to: type=gha,mode=max,scope=backup,ignore-error=true

    # The backup image adds `postgresql17*`, `age`, `bash`, `findmnt` apk
    # layers on top of node-alpine, each with its own CVE surface.
    - name: Trivy — backup image
      uses: ./.github/actions/trivy-image
      with:
        image_ref: projekt-manager-backup:ci

    # Alias the locally-built images to the GHCR refs the compose files
    # declare. No compose file sets `pull_policy`, so compose defaults to
    # `missing` and resolves both services from the local store — the
    # smoke exercises the real compose config against the exact bytes just
    # scanned, with nothing pushed yet.
    - name: Alias local images to their GHCR refs (so the smoke does not pull)
      shell: bash
      env:
        APP_REF: ${{ inputs.app_repo }}:${{ inputs.sha_tag }}
        BACKUP_REF: ${{ inputs.backup_repo }}:${{ inputs.sha_tag }}
      run: |
        set -euo pipefail
        docker tag projekt-manager-app:ci "$APP_REF"
        docker tag projekt-manager-backup:ci "$BACKUP_REF"
        echo "  $APP_REF"
        echo "  $BACKUP_REF"

    # `age` on the runner is needed by the smoke step below to mint a
    # per-run binary `age` keypair before `docker compose up`. The app
    # boot probe (assertBinaryIdentityLoaded — ADR-0024) refuses to start
    # without a tmpfs-loaded identity matching BINARY_AGE_RECIPIENT; the
    # recipient is interpolated into the app container's env at
    # compose-parse time, so it must exist before the stack comes up.
    #
    # The same SHA-pinned composite `check-shard` and `e2e.yml` call, so
    # all three identities are minted by the same `age` build. Was
    # `apt-get install -y age` until #374 — unpinned and unverified, on
    # the one binary in this pipeline that mints a crypto identity.
    - name: Install age (smoke prerequisite)
      uses: ./.github/actions/install-age

    # ---------------------------------------------------------------
    # Runtime smoke test — catch bugs that "does it compile?" misses.
    #
    # History (pre-#199): iteration 7 landed with six distinct runtime
    # defects that all passed `npm ci && npm test && docker build`. Each
    # one fired only when the container actually booted and ran its real
    # code path on a real DB:
    #   - dcron EPERM on setpgid (needed init:true) — gone with #199
    #     (croner does not fork; container runs non-root)
    #   - shared env schema required STORAGE_* (unused by backup-runner)
    #   - listen_addresses='' literal quotes in execve
    #   - pg Pool defaulting to a role that doesn't exist
    #   - /var/run tmpfs shadowing /run/drill-key
    #   - seed fixture readFileSync at module load (since fixed to an
    #     inlined JSON import so the specific ENOENT can't recur)
    #
    # Cheap defence: boot the full stack with the in-stack MinIO standing
    # in as the R2 target. Confirm the scheduler logged its
    # registered-jobs lines (catches a schedule-registration regression in
    # scheduleSubcommand), then run one `node backup-runner.js run` cycle
    # end to end. MinIO is S3-compatible for every call the uploader makes
    # (HeadBucket / PutObject / GetObject / ListObjectsV2), so this
    # exercises the real pipeline including the startup R2 HeadBucket
    # probe and the ephemeral-pg spawn under the postgres UID. An
    # env-schema error, spawn-quoting crash, peer-auth failure, missing
    # binary, or schedule-registration regression all surface here before
    # anything is pushed. Runtime cost is ~60–90s on GHA's hosted runners.
    # ---------------------------------------------------------------
    - name: Runtime smoke test
      shell: bash
      env:
        # Resolves to the locally-aliased images from the step above —
        # nothing is pulled from GHCR, and nothing has been pushed yet.
        APP_IMAGE_TAG: ${{ inputs.sha_tag }}
        # Placeholder secrets — the stack must start and one
        # `node backup-runner.js run` cycle must complete before any
        # of these matter to anything outside the compose network.
        POSTGRES_PASSWORD: smoke
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: smoke123
        # Capability-restricted MinIO app user (#45 / ADR-0022) —
        # `:?`-gated in the minio overlay because the app must NEVER
        # run as root. storage-init provisions this user.
        MINIO_APP_ACCESS_KEY: pmappsmoke
        MINIO_APP_SECRET_KEY: pmappsmokesecret
        # Object-storage env consumed by the app. The minio overlay
        # overrides STORAGE_ENDPOINT / STORAGE_PUBLIC_ENDPOINT /
        # STORAGE_REGION for the in-compose target; the base file's
        # `:?` gates need values at parse time so we set them too.
        # STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY mirror MINIO_APP_*
        # (the user the app actually runs as).
        STORAGE_ENDPOINT: http://storage:9000
        STORAGE_REGION: us-east-1
        STORAGE_BUCKET: projekt-manager
        STORAGE_ACCESS_KEY: pmappsmoke
        STORAGE_SECRET_KEY: pmappsmokesecret
        CLOUDFLARE_API_TOKEN: smoke
        # R2 target points at the in-stack MinIO. The backup
        # container's schedule subcommand (backup-runner.ts) runs
        # an authenticated HeadBucket probe on startup and exits
        # non-zero on any failure — an unreachable endpoint or a
        # missing bucket would crash the container into a restart
        # loop before any tick could be exercised. A reachable,
        # authenticated target lets the probe, the schedule
        # registration, and the upload pipeline run end to end.
        R2_ACCESS_KEY_ID: minioadmin
        R2_SECRET_ACCESS_KEY: smoke123
        R2_ENDPOINT: http://storage:9000
        R2_BUCKET: projekt-manager-backup-smoke
        R2_REGION: auto
        # Throwaway age recipient — must be a real Bech32-valid key so
        # `age` accepts it during encrypt. The private half is discarded:
        # smoke only exercises the forward path (encrypt + upload), never
        # decryption, so nothing in the smoke can read what it wrote.
        AGE_RECIPIENT: age15nf2qq4znfwup9khgjk0rdgp5wg9vx33fngc727m3zdkctq29djqyr9su6
        # App-side env vars normally sourced from .env on the VPS.
        DOMAIN: smoke.invalid
        WG_BIND_IP: 127.0.0.1
        # COMPOSE_FILE makes every plain `docker compose` call below
        # implicitly load BOTH the prod base file AND the MinIO mirror
        # overlay. The base file alone has no `storage` / `storage-init`
        # services (prod talks to B2); the smoke test stands MinIO in
        # for B2. `:` is the file separator in COMPOSE_FILE on POSIX.
        COMPOSE_FILE: docker-compose.yml:docker-compose.minio.yml
      run: |
        set -euo pipefail
        cleanup() {
          echo "::group::Smoke teardown"
          docker compose --profile backup logs backup --tail=80 || true
          docker compose --profile backup logs app --tail=40 || true
          docker compose --profile backup down -v --remove-orphans || true
          echo "::endgroup::"
        }
        trap cleanup EXIT

        # Per-run binary `age` keypair (ADR-0024). The boot probe
        # (assertBinaryIdentityLoaded) refuses to start the app
        # without a tmpfs-loaded identity matching
        # BINARY_AGE_RECIPIENT, which compose interpolates into the
        # app container's env at parse time — so the recipient must
        # exist BEFORE `docker compose up`. Mirrors the per-fork
        # keypair pattern in src/test/integration-setup.ts and
        # playwright.config.ts; the private half is loaded into the
        # app's tmpfs further down (after compose up but before the
        # boot probe runs — see "Load binary identity" group).
        BINARY_IDENTITY=$(age-keygen 2>/dev/null)
        BINARY_RECIPIENT=$(printf '%s' "$BINARY_IDENTITY" | age-keygen -y)
        export BINARY_AGE_RECIPIENT="$BINARY_RECIPIENT"

        echo "::group::Compose up (app stack, no backup yet)"
        # Explicit service list — caddy is skipped because it tries
        # to provision a TLS cert against the fake DOMAIN/token and
        # would otherwise dominate the log with ACME retries. Backup
        # is deferred until the R2 bucket exists on MinIO, otherwise
        # the schedule subcommand's startup HeadBucket probe would
        # 404 and the container would restart-loop. COMPOSE_FILE in
        # env: above picks up the minio overlay automatically.
        docker compose up -d db storage storage-init app
        echo "::endgroup::"

        echo "::group::Load binary identity via load-binary-key (operator path)"
        # Invoke the actual operator script — not a tee bypass — so
        # regressions in the script's runtime environment (missing
        # bash, missing age-keygen, broken tmpfs-invariant check,
        # etc.) surface here instead of on first real deploy. The
        # script reads stdin via `read -r -s -d $'\004'`, which
        # accepts EOF as a terminator, so piping the identity works
        # without a literal Ctrl-D byte. No `-t` because GHA has no
        # TTY; `read -s` is a no-op on non-TTY stdin and the rest of
        # the script is TTY-agnostic.
        #
        # The probe sits behind ~5s of pre-probe boot work (migrate +
        # bootstrapAdminIfEmpty + validateWorkflowStates +
        # assertStorageBucketSafe), so a 1s polling exec lands
        # comfortably ahead. If the app already crashed once before
        # we land, the next restart re-creates the tmpfs (PID 1 exit
        # kills the namespace), so we keep retrying until the
        # loader script actually succeeds AND its write survives.
        loaded=0
        last_out=""
        for i in $(seq 1 30); do
          if last_out=$(printf '%s' "$BINARY_IDENTITY" | \
                        docker exec -i projekt-manager-app-1 \
                        load-binary-key 2>&1); then
            echo "  $last_out"
            echo "  loaded via load-binary-key (attempt $i)"
            loaded=1
            break
          fi
          sleep 1
        done
        if [ "$loaded" != "1" ]; then
          echo "::error::load-binary-key did not succeed within 30s"
          printf '%s\n' "$last_out" >&2
          exit 1
        fi
        echo "::endgroup::"

        echo "::group::Wait for app readiness (up to 90s)"
        # Single source of truth in scripts/smoke-app-health.sh — same
        # probe deploy and sync-restore use. Per-attempt failure reasons
        # (HTTP status+body, fetch error) print inline so a smoke that
        # fails because storage went down doesn't look identical to one
        # that fails because Fastify never bound :3000.
        if ! ./scripts/smoke-app-health.sh projekt-manager-app-1 90; then
          echo "::error::App did not become ready"
          exit 1
        fi
        echo "::endgroup::"

        echo "::group::Create R2 smoke bucket on MinIO"
        # One-off mc container attached to the compose network,
        # reusing the storage-init service definition so no network-
        # name lookup is needed. --no-deps skips depends_on resolution
        # (storage is already up); -T disables TTY for cleaner logs.
        docker compose run --rm --no-deps -T \
          --entrypoint /bin/sh \
          storage-init \
          -c "mc alias set local http://storage:9000 \"\$MINIO_ROOT_USER\" \"\$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/${R2_BUCKET}"
        echo "::endgroup::"

        echo "::group::Bring up backup container"
        docker compose --profile backup up -d backup
        echo "::endgroup::"

        echo "::group::Backup container stable? (up to 20s)"
        # Poll briefly so we don't race the startup R2 probe — the
        # probe runs early in scheduleSubcommand and the container
        # reports 'running' before the probe has had a chance to
        # crash it. A stable container in this window passed the
        # probe and registered the croner schedule.
        for i in $(seq 1 10); do
          running=$(docker inspect projekt-manager-backup-1 --format '{{.State.Running}}' 2>/dev/null || echo false)
          restarts=$(docker inspect projekt-manager-backup-1 --format '{{.RestartCount}}' 2>/dev/null || echo 0)
          echo "  attempt $i: running=$running restarts=$restarts"
          if [ "$running" = "true" ] && [ "$restarts" = "0" ]; then
            sleep 2
            continue
          fi
          break
        done
        if [ "$running" != "true" ] || [ "$restarts" -gt 0 ]; then
          echo "::error::Backup container is not healthy (running=$running restarts=$restarts)"
          exit 1
        fi
        echo "::endgroup::"

        echo "::group::Scheduler registered all four cron jobs?"
        # scheduleSubcommand logs one "registered <name> next=..." line
        # per croner job at boot. Confirming all four are present
        # catches a regression where a job's cron expression is
        # malformed (croner throws at construction → only the earlier
        # jobs ever registered), or where buildScheduleJobs returned
        # fewer than four entries. The unit tests in
        # backup-runner-schedule.test.ts cover the wiring at the
        # function level; this smoke proves the wiring survives an
        # actual container boot.
        backup_logs=$(docker logs projekt-manager-backup-1 2>&1)
        echo "$backup_logs"
        for name in backup-weekday backup-weekend drill-weekday drill-weekend; do
          if ! printf '%s' "$backup_logs" | grep -q "schedule: registered ${name} next="; then
            echo "::error::scheduler did not log a 'registered ${name}' line at boot"
            exit 1
          fi
        done
        echo "  all four croner jobs registered — smoke OK"
        echo "::endgroup::"

        echo "::group::Run one backup cycle"
        # Full pipeline: env parse, pg_dump, ephemeral-pg verify,
        # age encrypt, PutObject to MinIO. Expected rc=0 — MinIO
        # is S3-compatible for every call the uploader makes. A
        # non-zero rc here is a real runtime defect the image-build
        # phase did not catch.
        #
        # NOTE: this is a SEPARATE node process from the scheduler
        # in PID 1; the manual `run` subcommand is not serialised
        # against an in-flight scheduled tick (croner's protect: true
        # only covers intra-process). Acceptable here because the
        # smoke clock is unlikely to land on the schedule's tick
        # window during the ~5-min run.
        set +e
        backup_out=$(docker exec projekt-manager-backup-1 \
          node /app/dist/server/backup-runner.js run 2>&1)
        backup_rc=$?
        set -e
        echo "$backup_out"
        echo "  exit code: $backup_rc"
        if [ "$backup_rc" != "0" ]; then
          echo "::error::backup-runner run failed end-to-end against MinIO — see output above"
          exit 1
        fi
        echo "  backup-runner run completed end-to-end — smoke OK"
        echo "::endgroup::"

        echo "::group::Drill-key tmpfs reachable?"
        # Catches the /var/run tmpfs shadowing /run/drill-key bug by
        # confirming the script can at least reach the write path
        # (sends an empty paste — load-drill-key rejects with a
        # clear "empty input" message, which proves the tmpfs-invariant
        # check passed).
        set +e
        dk_out=$(echo | docker exec -i projekt-manager-backup-1 /usr/local/bin/load-drill-key 2>&1)
        dk_rc=$?
        set -e
        echo "$dk_out"
        if echo "$dk_out" | grep -q "not a tmpfs mount"; then
          echo "::error::load-drill-key reports /run/drill-key is not tmpfs — the /var/run tmpfs is shadowing it again"
          exit 1
        fi
        if echo "$dk_out" | grep -q "No such file or directory"; then
          echo "::error::load-drill-key cannot reach /run/drill-key/identity — mount topology regressed"
          exit 1
        fi
        echo "  drill-key tmpfs path is reachable — smoke OK"
        echo "::endgroup::"

    # ---------------------------------------------------------------
    # Push by digest — same context and same build-args as the validation
    # builds above, so BuildKit serves every layer from the builder's own
    # cache and these steps cost only the registry upload. The added
    # attestation changes the assembled image, not the cache keys of the
    # steps that build it.
    #
    # `push-by-digest=true` publishes the manifest with NO tag. The bytes
    # are on GHCR and addressable as `<repo>@sha256:…`, but no name
    # resolves to them: `scripts/deploy.sh` cannot pull one, `promote`'s
    # guard 3 cannot find one, and nothing on the VPS can run one. That is
    # what lets the push sit here — ahead of the `docker` job's Tier 1
    # round-trip and ahead of `check`/`lint` — without weakening the
    # invariant. `tag-images` gives the digests names, and it runs only
    # after every gate has passed.
    #
    # No `cache-to`: the validation builds above already exported both
    # scopes for this ref, nothing reads a second copy, and the export
    # competes for the same 10 GB per-repo cap.
    # ---------------------------------------------------------------
    - name: Push app image by digest
      id: push_app
      if: inputs.push_by_digest == 'true'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile
        provenance: mode=max
        outputs: type=image,name=${{ inputs.app_repo }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          GIT_SHA=${{ inputs.git_sha }}
        cache-from: type=gha

    - name: Push backup image by digest
      id: push_backup
      if: inputs.push_by_digest == 'true'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: Dockerfile.backup
        provenance: mode=max
        outputs: type=image,name=${{ inputs.backup_repo }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          APP_IMAGE_TAG=${{ inputs.sha_tag }}
        build-contexts: |
          ${{ inputs.app_repo }}:${{ inputs.sha_tag }}=oci-layout:///tmp/app-oci
        cache-from: type=gha,scope=backup
